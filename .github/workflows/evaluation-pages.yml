name: Publish documentation and evaluation example
run-name: Publish guide ${{ inputs.expected_sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      build_pdf:
        description: 'Generate a new PDF export (slower; otherwise retain the published PDF)'
        type: boolean
        default: true
      expected_sha:
        description: Commit requested by publish.sh
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: evaluation-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify requested revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [ -n "$EXPECTED_SHA" ]; then
            test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Build the guide
        run: |
          pip install -r requirements-docs.txt
          mkdocs build --strict --site-dir _site/guide
      - name: Generate PDF export
        if: inputs.build_pdf
        run: weasyprint _site/guide/print.html _site/guide/guide.pdf
      - name: Retain last published PDF
        if: ${{ !inputs.build_pdf }}
        run: curl --fail --silent --show-error --location --retry 2 --max-time 30 https://bobfischer.github.io/beyond-chat-todo/guide/guide.pdf -o _site/guide/guide.pdf
      - name: Check guide links
        run: python .github/check_docs.py _site/guide
      - name: Prepare the public evaluation example
        run: python scripts/prepare_docs_site.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
