name: Publish documentation and evaluation example

on:
  workflow_dispatch:
    inputs:
      build_pdf:
        description: 'Generate a new PDF export (slower; otherwise retain the published PDF)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: evaluation-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Build the guide
        run: |
          pip install -r requirements-docs.txt
          mkdocs build --strict --site-dir _site/guide
      - name: Generate PDF export
        if: inputs.build_pdf
        run: weasyprint _site/guide/print.html _site/guide/guide.pdf
      - name: Retain last published PDF
        if: ${{ !inputs.build_pdf }}
        run: curl --fail --silent --show-error --location --retry 2 --max-time 30 https://bobfischer.github.io/beyond-chat-todo/guide/guide.pdf -o _site/guide/guide.pdf
      - name: Check guide links
        run: python .github/check_docs.py _site/guide
      - name: Prepare the public evaluation example
        run: |
          mkdir -p _site
          cp examples/evaluation-review/index.html examples/evaluation-review/collection.json _site/
          python3 - <<'PY'
          from pathlib import Path
          page = Path('_site/index.html')
          text = page.read_text()
          base = 'https://github.com/bobfischer/beyond-chat-todo/blob/main/'
          text = text.replace('href="../../docs/guides/evaluation-results.md"', f'href="{base}docs/guides/evaluation-results.md"')
          text = text.replace('href="README.md#what-this-example-measures"', f'href="{base}examples/evaluation-review/README.md#what-this-example-measures"')
          page.write_text(text)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
