site_name: Build better agents
site_description: A practical guide to building and evaluating agents inside applications.
site_url: https://bobfischer.github.io/beyond-chat-todo/guide/
repo_url: https://github.com/bobfischer/beyond-chat-todo
repo_name: bobfischer/beyond-chat-todo
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site/guide
use_directory_urls: false
exclude_docs: |
  README.md
  __pycache__/
  OUTLINE.md
  BUILDING.md
  MAINTENANCE.md
hooks:
  - .github/docs_hooks.py
theme:
  name: material
  logo: images/eliassen-primary-white.svg
  font: false
  palette:
    primary: indigo
    accent: teal
  features:
    - navigation.expand
    - navigation.footer
    - navigation.top
    - search.suggest
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - md_in_html
  - tables
  - admonition
  - fenced_code
  - attr_list
  - toc:
      title: In this section
      toc_depth: "2-2"
      permalink: true
extra_javascript:
  - javascripts/demo-return.js?v=1
  - javascripts/checklist-builder.js?v=3
extra_css:
  - stylesheets/guide.css?v=20261018-nav-text
  - stylesheets/tables.css?v=1
  - stylesheets/checklist-builder.css?v=2
nav:
  - Cover: index.md
  # docs_hooks.py adds a relative Introduction anchor after Cover.
  - Design:
    - Why an embedded agent?: guide/why.md
    - Shared capabilities and the registry: guide/design.md
    - Understand and complete the request: guide/requests.md
    - Learn about me: guide/onboarding.md
    - Authority and recovery: guide/authority.md
    - Tools and current evidence: guide/tools.md
    - Interfaces and views: guide/interfaces.md
    - The agent in the UI: guide/agent-experience.md
  - Implementation:
    - Run the sample: guide/start.md
    - Follow a request: guides/walkthrough.md
    - Choose models: guides/models.md
  - Evaluation:
    - Explore the experience: guide/exploration.md
    - Evaluate outcomes: guide/evaluation.md
    - Review results and understand variation: guides/evaluation-results.md
    - Example evaluation report: https://bobfischer.github.io/beyond-chat-todo/
    - Optional tracing: guides/langfuse.md
  - Apply it to your app: guide/apply.md
  - Build your coding-agent handoff: guide/checklist-builder.md
  - Appendices:
    - How to build and extend your registry: reference/capability-declarations.md
    - Inspect capabilities and execution: reference/inspection.md
    - Support references to earlier work: reference/conversation-references.md
  - Review references:
    - Implementation and acceptance checks: principles/implementation.md
    - Sample coverage and limitations: guides/sample-assessment.md
    - Sources and further reading: reference/sources.md
  - Download last PDF export: https://bobfischer.github.io/beyond-chat-todo/guide/guide.pdf
  - Read as one page: https://bobfischer.github.io/beyond-chat-todo/guide/print.html
