<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Todos</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#111;font:16px/1.5 "Source Sans 3","Source Sans Pro",Arial,sans-serif}main{max-width:1300px;margin:auto;padding:44px 32px}a{color:#b83f45}.stage{display:grid;grid-template-columns:1fr 1fr;gap:64px}h1{margin:0 0 8px;text-align:center;font:200 56px/1.1 "Helvetica Neue",Helvetica,Arial,sans-serif;color:#b83f45}.panel{padding:16px;background:#fff;border:1px solid #ddd;border-radius:8px;box-shadow:0 2px 4px #0003,0 25px 50px #0002}.chat{height:260px;overflow:auto;scrollbar-width:thin}.message{display:flex;gap:10px;padding:6px 10px;margin-bottom:16px;font-size:14.4px;line-height:1.45}.message.sam{background:#f7f7f9;border-radius:8px}.message p{margin:0 0 14px}.message p:last-child{margin:0}.avatar{width:26px;height:26px;flex-shrink:0;display:grid;place-items:center;border-radius:6px;background:#33438f;color:white;font-weight:600}.assistant .avatar{background:#ffad33}.message-text{white-space:pre-wrap;min-width:0;overflow-wrap:anywhere}.composer{height:64px;margin-top:16px;padding:16px 24px;border:1px solid #b83f45;border-radius:8px;color:#888;font-size:14px;display:flex;align-items:center;justify-content:space-between}.send{background:#f5f5f5;border-radius:8px;padding:0 8px;color:#aaa;font-size:26px}.controls{display:grid;grid-template-columns:3fr 1.3fr 1.2fr;gap:16px;align-items:end;margin-top:20px}.controls label{display:block;font-size:14px;margin-bottom:6px}button,select{font:inherit;font-size:14px;color:#111;border:1px solid #ddd;background:#fff;border-radius:8px;height:44px;padding:0 12px;width:100%;cursor:pointer}button:hover{border-color:#b83f45;color:#b83f45}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #b83f45;outline-offset:2px}button:disabled{opacity:.5;cursor:default}.persona-card{display:flex;gap:10px;margin-top:18px;font-size:13.6px;line-height:1.5;color:#4f6599}.persona-card b{color:#1b1e32}.links{display:flex;gap:16px;margin-top:28px;font-size:13px}.links button{width:auto;height:auto;border:0;padding:0;background:none;color:#b83f45;text-decoration:underline}#event{font-size:13px;color:#666;margin:8px 0 0;min-height:20px}#error{color:#b83f45} [hidden]{display:none!important}@media(max-width:760px){main{padding:24px 16px}.stage{grid-template-columns:1fr;gap:32px}}
</style></head><body><main>
<div class="stage"><section id="todo-host" aria-label="Recorded todo list"></section>
<section aria-label="Recorded conversation"><h1>assistant</h1><div class="panel"><div class="chat" id="chat"><small>Ask it to add, date, finish or reorder todos.</small></div><div class="composer" aria-disabled="true"><span>Tell the assistant what to do</span><span class="send" aria-hidden="true">↑</span></div></div>
<div class="controls"><div><label for="persona-picker">Persona</label><select id="persona-picker"><option>-- Prerecorded Run --</option></select></div><button id="play">▷ &nbsp; Play</button><button id="next">▹| &nbsp; Next</button></div>
<div class="persona-card"><span class="avatar">S</span><div id="persona"></div></div><p id="event" role="status" aria-live="polite"></p><p id="error" role="alert" hidden></p>
</section></div>
<div class="links"><a href="../index.html#introduction">Back to the guide</a><a href="../guide/start.html">Run the app locally</a><button id="restart">Restart recording</button></div>
</main><script type="module" src="persona-replay.js"></script></body></html>
