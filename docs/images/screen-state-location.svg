<text x="32" y="66">Streamlit, as in the Todo sample</text>
<text x="432" y="42" class="label">View state in the browser</text>
<text x="432" y="66">React and similar frameworks</text>

<rect x="32" y="82" width="336" height="68" rx="4" fill="white"/>
<text x="46" y="108" class="b">Browser</text>
<text x="46" y="134">The page draws what it is sent</text>
<rect x="32" y="252" width="336" height="76" rx="4" fill="white"/>
<text x="46" y="278" class="b">Server</text>
<text x="46" y="304">The agent  +  <tspan class="state">the view state</tspan></text>
