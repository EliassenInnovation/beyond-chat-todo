<path d="M104 240L110 248L116 240 M244 162L250 154L256 162" stroke="#8EBFB3" stroke-width="3" fill="none"/>
<text x="120" y="207">clicks</text>
<text x="260" y="207">new view</text>

<rect x="432" y="82" width="336" height="68" rx="4" fill="white"/>
<text x="446" y="108" class="b">Browser</text>
<text x="446" y="134">The page  +  <tspan class="state">the view state</tspan></text>
<rect x="432" y="252" width="336" height="76" rx="4" fill="white"/>
<text x="446" y="278" class="b">Server</text>
