<svg xmlns="http://www.w3.org/2000/svg" width="800" height="424" viewBox="0 0 800 424" role="img" aria-label="Two arrangements. On the left the view state is on the server with the agent: the browser sends clicks and receives the new view. On the right the view state is in the browser: the page sends a snapshot, the server sends an event, and the page sends a reply. In both, the server checks deletes, trades and payments."><desc>Two arrangements. On the left the view state is on the server with the agent: the browser sends clicks and receives the new view. On the right the view state is in the browser: the page sends a snapshot, the server sends an event, and the page sends a reply. In both, the server checks deletes, trades and payments.</desc><style>text{font-family:Arial,sans-serif;fill:#1A1E33;font-size:18px}.label{font-weight:700;font-size:20px}.b{font-weight:700}.head{fill:white;font-weight:700;font-size:20px}.state{fill:#2E4294;font-weight:700}</style><rect width="800" height="424" fill="white"/>
