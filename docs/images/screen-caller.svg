<text x="160" y="174" class="head">execute runs the action todos.delete</text>
<text x="160" y="201" style="fill:white;font-size:18px">It looks up the policy declared for that caller</text>
<path d="M400 220V240H200V260 M400 240H600V260" stroke="#8EBFB3" stroke-width="3" fill="none"/>
<path d="M194 252L200 260L206 252 M594 252L600 260L606 252" stroke="#8EBFB3" stroke-width="3" fill="none"/>
