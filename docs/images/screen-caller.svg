<rect x="416" y="12" width="368" height="88" rx="6" fill="#F5F1EE"/>
<text x="32" y="44" class="label">The person clicks × on a todo</text>
<text x="32" y="76" class="code">actor='person'</text>
<text x="432" y="44" class="label">The agent calls request_delete</text>
<text x="432" y="76" class="code">actor='agent'</text>
