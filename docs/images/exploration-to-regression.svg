<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280" role="img" aria-label="Review findings and apparent successes. Confirmed problems become regression cases with held-out variants; keep unconfirmed findings for later review."><title>From exploration to regression cases</title><desc>Review findings and apparent successes. Confirmed problems become regression cases with held-out variants; keep unconfirmed findings for later review.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#2e4294"/></marker></defs><g font-family="Arial,sans-serif" font-size="16" fill="#1a1e33"><rect x="8" y="12" width="176" height="108" rx="6" fill="#f5f1ee"/><path d="M14 12H178Q184 12 184 18V46H8V18Q8 12 14 12" fill="#2e4294"/><text x="20" y="36" fill="white">Explore</text><text x="20" y="73">You or a persona</text><text x="20" y="95">tries real work</text><rect x="210" y="12" width="176" height="108" rx="6" fill="#f5f1ee"/><path d="M216 12H380Q386 12 386 18V46H210V18Q210 12 216 12" fill="#2e4294"/><text x="222" y="36" fill="white">Inspect</text><text x="222" y="73">Flagged findings</text><text x="222" y="95">Sample successes</text><rect x="412" y="12" width="176" height="108" rx="6" fill="#f5f1ee"/><path d="M418 12H582Q588 12 588 18V46H412V18Q412 12 418 12" fill="#2e4294"/><text x="424" y="36" fill="white">Review</text><text x="424" y="73">A person asks a</text><text x="424" y="95">focused question</text><rect x="614" y="12" width="178" height="108" rx="6" fill="#f5f1ee"/><path d="M620 12H786Q792 12 792 18V46H614V18Q614 12 620 12" fill="#2e4294"/><text x="626" y="36" fill="white">Confirmed</text><text x="626" y="73">Regression case</text><text x="626" y="95">Held-out variant</text><path d="M186 66h20" stroke="#2e4294" stroke-width="2" marker-end="url(#a)"/><path d="M388 66h20" stroke="#2e4294" stroke-width="2" marker-end="url(#a)"/><path d="M590 66h20" stroke="#2e4294" stroke-width="2" marker-end="url(#a)"/><path d="M500 120v39" stroke="#2e4294" stroke-width="2" marker-end="url(#a)"/><rect x="412" y="164" width="380" height="69" rx="6" fill="#f5f1ee"/><text x="426" y="190">Unconfirmed: retain for later review.</text><text x="426" y="216">Add to the suite once the problem is confirmed.</text><text x="8" y="262" font-size="14">Use confirmed cases in fixed evaluations; keep held-out wording separate from development feedback.</text></g></svg>