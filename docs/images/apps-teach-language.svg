<svg xmlns="http://www.w3.org/2000/svg" width="800" height="324" viewBox="0 0 800 324" role="img" aria-labelledby="title desc"><title id="title">Words we learn from applications</title><desc id="desc">Presentation software teaches deck and slide template; spreadsheets teach cell and pivot table; online stores teach add to cart; email teaches out of office and reply all; music apps teach playlist.</desc><rect width="800" height="324" fill="white"/>
<rect x="16" y="10" width="360" height="66" rx="6" fill="#f5f1ee"/><text x="32" y="38" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1a1e33">“a deck”</text><text x="32" y="62" font-family="Arial, sans-serif" font-size="18" fill="#2e4294">Presentations</text>
<rect x="424" y="10" width="360" height="66" rx="6" fill="#f5f1ee"/><text x="440" y="38" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1a1e33">“a slide template”</text><text x="440" y="62" font-family="Arial, sans-serif" font-size="18" fill="#2e4294">Presentations</text>
<rect x="16" y="88" width="360" height="66" rx="6" fill="#f5f1ee"/><text x="32" y="116" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1a1e33">“a cell”</text><text x="32" y="140" font-family="Arial, sans-serif" font-size="18" fill="#2e4294">Spreadsheets</text>
<rect x="424" y="88" width="360" height="66" rx="6" fill="#f5f1ee"/><text x="440" y="116" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1a1e33">“a pivot table”</text><text x="440" y="140" font-family="Arial, sans-serif" font-size="18" fill="#2e4294">Spreadsheets</text>
<rect x="16" y="166" width="360" height="66" rx="6" fill="#f5f1ee"/><text x="32" y="194" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1a1e33">“add to cart”</text><text x="32" y="218" font-family="Arial, sans-serif" font-size="18" fill="#2e4294">Online stores</text>
<rect x="424" y="166" width="360" height="66" rx="6" fill="#f5f1ee"/><text x="440" y="194" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1a1e33">“out of office”</text><text x="440" y="218" font-family="Arial, sans-serif" font-size="18" fill="#2e4294">Email</text>
<rect x="16" y="244" width="360" height="66" rx="6" fill="#f5f1ee"/><text x="32" y="272" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1a1e33">“reply all”</text><text x="32" y="296" font-family="Arial, sans-serif" font-size="18" fill="#2e4294">Email</text>
<rect x="424" y="244" width="360" height="66" rx="6" fill="#f5f1ee"/><text x="440" y="272" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1a1e33">“a playlist”</text><text x="440" y="296" font-family="Arial, sans-serif" font-size="18" fill="#2e4294">Music apps</text>
</svg>