<svg xmlns="http://www.w3.org/2000/svg" width="800" height="446" viewBox="0 0 800 446" role="img" aria-label="Advisor keeps the panel closed only when every required condition holds; otherwise it opens the conversation."><desc>Advisor keeps the panel closed only when every required condition holds; otherwise it opens the conversation.</desc><style>text{font-family:Arial,sans-serif;fill:#1A1E33;font-size:20px}.head{fill:white;font-weight:700}.label{font-weight:700}.small{font-size:18px}</style><rect width="800" height="446" fill="white"/><text x="16" y="25" class="label">The reply arrives</text><text x="430" y="25" class="small">Application checks the result</text><rect x="16" y="42" width="416" height="38" rx="5" fill="#F5F1EE"/><text x="28" y="67" class="small">Any error?</text><path d="M224 80V92" stroke="#8EBFB3" stroke-width="2"/><text x="237" y="91" style="font-size:13px">No</text><path d="M432 61H514" stroke="#2E4294" stroke-width="2"/><text x="450" y="54" style="font-size:14px">Yes</text><rect x="16" y="94" width="416" height="38" rx="5" fill="#F5F1EE"/><text x="28" y="119" class="small">Changed something or navigated?</text><path d="M224 132V144" stroke="#8EBFB3" stroke-width="2"/><text x="237" y="143" style="font-size:13px">Yes</text><path d="M432 113H514" stroke="#2E4294" stroke-width="2"/><text x="450" y="106" style="font-size:14px">No</text><rect x="16" y="146" width="416" height="38" rx="5" fill="#F5F1EE"/><text x="28" y="171" class="small">Every step succeeded, no warning?</text><path d="M224 184V196" stroke="#8EBFB3" stroke-width="2"/><text x="237" y="195" style="font-size:13px">Yes</text><path d="M432 165H514" stroke="#2E4294" stroke-width="2"/><text x="450" y="158" style="font-size:14px">No</text><rect x="16" y="198" width="416" height="38" rx="5" fill="#F5F1EE"/><text x="28" y="223" class="small">Whole change fully visible now?</text><path d="M224 236V248" stroke="#8EBFB3" stroke-width="2"/><text x="237" y="247" style="font-size:13px">Yes</text><path d="M432 217H514" stroke="#2E4294" stroke-width="2"/><text x="450" y="210" style="font-size:14px">No</text><rect x="16" y="250" width="416" height="38" rx="5" fill="#F5F1EE"/><text x="28" y="275" class="small">Reply asks no question?</text><path d="M224 288V300" stroke="#8EBFB3" stroke-width="2"/><text x="237" y="299" style="font-size:13px">Yes</text><path d="M432 269H514" stroke="#2E4294" stroke-width="2"/><text x="450" y="262" style="font-size:14px">No</text><rect x="16" y="302" width="416" height="38" rx="5" fill="#F5F1EE"/><text x="28" y="327" class="small">Change still current?</text><path d="M432 321H514" stroke="#2E4294" stroke-width="2"/><text x="450" y="314" style="font-size:14px">No</text><path d="M514 61V321 M514 191H548 M539 185L548 191L539 197" stroke="#2E4294" stroke-width="2" fill="none"/><rect x="552" y="152" width="232" height="80" rx="5" fill="#2E4294"/><text x="568" y="182" class="head">Open conversation</text><text x="568" y="212" class="head" style="font-size:18px">Show the reply</text><path d="M224 340V366" stroke="#8EBFB3" stroke-width="2"/><text x="237" y="357" style="font-size:14px">Yes</text><rect x="16" y="368" width="416" height="66" rx="5" fill="#8EBFB3"/><text x="28" y="394" class="label">Stay closed</text><text x="28" y="420" class="small">Code confirmation in status bar · 6 seconds</text></svg>