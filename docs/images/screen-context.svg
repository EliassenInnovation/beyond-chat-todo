<ellipse cx="238" cy="527" rx="52" ry="22" fill="none" stroke="#E7B572" stroke-width="4" />
<text x="84" y="594" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="19" fill="#1A1E33">The agent filtered the list and is pointing at “Active.”</text>
<rect x="980" y="236" width="560" height="420" rx="8" fill="#F2F1EE" />
<path d="M980,286 V244 Q980,236 988,236 H1532 Q1540,236 1540,244 V286 Z" fill="#2E4394" />
<text x="1004" y="269" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">The agent</text>
<text x="1004" y="334" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#1A1E33">It knows</text>
<text x="1004" y="370" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="22" fill="#1A1E33">the active filter and visible task IDs,</text>
<text x="1004" y="400" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="22" fill="#1A1E33">plus the names of the controls</text>
<text x="1004" y="460" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#1A1E33">It can work the screen</text>
<text x="1004" y="494" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="22" fill="#1A1E33">filter the view</text>
<text x="1004" y="522" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="22" fill="#1A1E33">and point at a control</text>
<line x1="634" y1="360" x2="966" y2="360" stroke="#2E4394" stroke-width="4" marker-end="url(#a)" />
<text x="800" y="340" text-anchor="middle" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#1A1E33">What the person is looking at</text>
<line x1="966" y1="530" x2="634" y2="530" stroke="#2E4394" stroke-width="4" marker-end="url(#a)" />
<text x="800" y="510" text-anchor="middle" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#1A1E33">How to operate the app</text>
<text x="1004" y="572" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#1A1E33">It can make changes</text>
<text x="1004" y="606" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="22" fill="#1A1E33">through the same capabilities as the screen,</text>
<text x="1004" y="634" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="22" fill="#1A1E33">with permissions for its caller</text>
