<svg xmlns="http://www.w3.org/2000/svg" width="800" height="538" viewBox="0 0 800 538" role="img" aria-label="The person’s screen and the agent exchange current screen context and shared screen actions."><desc>The person’s screen and the agent exchange current screen context and shared screen actions.</desc><rect width="800" height="538" fill="white"/><rect x="16" y="16" width="360" height="344" rx="7" fill="#f2f1ee"/><rect x="16" y="16" width="360" height="42" rx="7" fill="#48669d"/><text xml:space="preserve" x="30" y="44" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="700">The person’s screen</text><text xml:space="preserve" x="30" y="88" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">Showing 2 of 7 tasks</text><text xml:space="preserve" x="30" y="115" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33"></text><text xml:space="preserve" x="30" y="142" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">Renew passport — Sep 10</text><text xml:space="preserve" x="30" y="169" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">Return library books — Sep 15</text><text xml:space="preserve" x="30" y="196" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33"></text><text xml:space="preserve" x="30" y="223" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">All    Active    Completed</text><rect x="424" y="16" width="360" height="344" rx="7" fill="#f2f1ee"/><rect x="424" y="16" width="360" height="42" rx="7" fill="#304698"/><text xml:space="preserve" x="438" y="44" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="700">The agent</text><text xml:space="preserve" x="438" y="88" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">Knows the active filter,</text><text xml:space="preserve" x="438" y="115" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">visible tasks and control names.</text><text xml:space="preserve" x="438" y="142" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33"></text><text xml:space="preserve" x="438" y="169" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">Can filter the view and</text><text xml:space="preserve" x="438" y="196" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">point to a control.</text><text xml:space="preserve" x="438" y="223" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33"></text><text xml:space="preserve" x="438" y="250" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">Uses shared operations and</text><text xml:space="preserve" x="438" y="277" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">caller-specific permissions.</text><path d="M200 370 V398 H600 V370 M593 377 l7 -7 7 7" fill="none" stroke="#6a92a7" stroke-width="3"/><text xml:space="preserve" x="238" y="429" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">Observe the current screen</text><path d="M600 450 V478 H200 V450 M193 457 l7 -7 7 7" fill="none" stroke="#6a92a7" stroke-width="3"/><text xml:space="preserve" x="246" y="510" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">Update the shared view</text></svg>