<svg xmlns="http://www.w3.org/2000/svg" width="560" height="804" viewBox="0 0 560 804" role="img" aria-label="The agent reads the active filter, visible tasks and control names, then uses shared operations to filter or highlight the screen."><desc>The agent reads the active filter, visible tasks and control names, then uses shared operations to filter or highlight the screen.</desc><rect width="560" height="804" fill="white"/><rect x="16" y="16" width="528" height="188" rx="9" fill="#f3f4f6"/><rect x="16" y="16" width="528" height="46" rx="9" fill="#304698"/><text x="32" y="47" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="700">The person’s screen</text><text x="32" y="94" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">Showing 2 of 7 tasks</text><text x="32" y="125" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">Renew passport — Sep 10</text><text x="32" y="156" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">Return library books — Sep 15</text><text x="32" y="187" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">Controls: All · Active · Completed</text><path d="M280 212 v26 m-7 -7 l7 7 7 -7" fill="none" stroke="#577f91" stroke-width="3"/><text x="305" y="233" font-family="Arial, sans-serif" font-size="18" fill="#577f91">Observe</text><rect x="16" y="252" width="528" height="126" rx="9" fill="#f3f4f6"/><rect x="16" y="252" width="528" height="46" rx="9" fill="#304698"/><text x="32" y="283" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="700">What the agent receives</text><text x="32" y="330" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">Active filter and visible task IDs</text><text x="32" y="361" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">Names and locations of controls</text><path d="M280 386 v26 m-7 -7 l7 7 7 -7" fill="none" stroke="#577f91" stroke-width="3"/><text x="305" y="407" font-family="Arial, sans-serif" font-size="18" fill="#577f91">Act</text><rect x="16" y="426" width="528" height="188" rx="9" fill="#f3f4f6"/><rect x="16" y="426" width="528" height="46" rx="9" fill="#304698"/><text x="32" y="457" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="700">What the agent can do</text><text x="32" y="504" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">Change the filter</text><text x="32" y="535" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">Point to the Active control</text><text x="32" y="566" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">Change tasks through shared operations</text><text x="32" y="597" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">with permissions for its caller</text><path d="M280 622 v26 m-7 -7 l7 7 7 -7" fill="none" stroke="#577f91" stroke-width="3"/><rect x="16" y="662" width="528" height="126" rx="9" fill="#f3f4f6"/><rect x="16" y="662" width="528" height="46" rx="9" fill="#577f91"/><text x="32" y="693" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="700">The updated screen</text><text x="32" y="740" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">The person sees the resulting view.</text><text x="32" y="771" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">Hidden tasks remain stored.</text></svg>