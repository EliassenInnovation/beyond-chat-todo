<svg xmlns="http://www.w3.org/2000/svg" width="800" height="466" viewBox="0 0 800 466" role="img" aria-label="Three paired examples of goal language and application language."><desc>Three paired examples of goal language and application language.</desc><rect width="800" height="466" fill="white"/><text xml:space="preserve" x="30" y="40" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33" font-weight="700">The language of the job</text><text xml:space="preserve" x="430" y="40" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33" font-weight="700">The application’s language</text><rect x="16" y="66" width="360" height="110" rx="7" fill="#f2f1ee"/><rect x="424" y="66" width="360" height="110" rx="7" fill="#48669d"/><text xml:space="preserve" x="32" y="108" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">“Find a charger that works</text><text xml:space="preserve" x="32" y="137" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">with this laptop.”</text><text xml:space="preserve" x="440" y="108" font-family="Arial, sans-serif" font-size="22" fill="white">“Add the 65-watt USB-C</text><text xml:space="preserve" x="440" y="137" font-family="Arial, sans-serif" font-size="22" fill="white">charger to my cart.”</text><path d="M386 121 H414 m-7 -7 l7 7 -7 7 M393 114 l-7 7 7 7" fill="none" stroke="#6a92a7" stroke-width="3"/><rect x="16" y="200" width="360" height="110" rx="7" fill="#f2f1ee"/><rect x="424" y="200" width="360" height="110" rx="7" fill="#48669d"/><text xml:space="preserve" x="32" y="242" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">“Show me sales</text><text xml:space="preserve" x="32" y="271" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">by region.”</text><text xml:space="preserve" x="440" y="242" font-family="Arial, sans-serif" font-size="22" fill="white">“Make a pivot table</text><text xml:space="preserve" x="440" y="271" font-family="Arial, sans-serif" font-size="22" fill="white">of sales by region.”</text><path d="M386 255 H414 m-7 -7 l7 7 -7 7 M393 248 l-7 7 7 7" fill="none" stroke="#6a92a7" stroke-width="3"/><rect x="16" y="334" width="360" height="110" rx="7" fill="#f2f1ee"/><rect x="424" y="334" width="360" height="110" rx="7" fill="#48669d"/><text xml:space="preserve" x="32" y="376" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">“I am away next week;</text><text xml:space="preserve" x="32" y="405" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">let people know.”</text><text xml:space="preserve" x="440" y="376" font-family="Arial, sans-serif" font-size="22" fill="white">“Turn on out of office.”</text><path d="M386 389 H414 m-7 -7 l7 7 -7 7 M393 382 l-7 7 7 7" fill="none" stroke="#6a92a7" stroke-width="3"/></svg>