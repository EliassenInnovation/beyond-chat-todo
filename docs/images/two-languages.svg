<svg xmlns="http://www.w3.org/2000/svg" width="560" height="926" viewBox="0 0 560 926" role="img" aria-label="Three examples connecting the language of a user goal to the language of application operations."><desc>Three examples connecting the language of a user goal to the language of application operations.</desc><rect width="560" height="926" fill="white"/><rect x="16" y="16" width="528" height="126" rx="9" fill="#f3f4f6"/><rect x="16" y="16" width="528" height="46" rx="9" fill="#577f91"/><text x="32" y="47" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="700">The person’s goal</text><text x="32" y="94" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">“Find a charger that works</text><text x="32" y="125" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">with this laptop.”</text><path d="M280 150 v26 m-7 -7 l7 7 7 -7" fill="none" stroke="#577f91" stroke-width="3"/><rect x="16" y="190" width="528" height="126" rx="9" fill="#f3f4f6"/><rect x="16" y="190" width="528" height="46" rx="9" fill="#304698"/><text x="32" y="221" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="700">The application’s operation</text><text x="32" y="268" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">“Add the 65-watt USB-C charger</text><text x="32" y="299" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">to my cart.”</text><rect x="16" y="340" width="528" height="95" rx="9" fill="#f3f4f6"/><rect x="16" y="340" width="528" height="46" rx="9" fill="#577f91"/><text x="32" y="371" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="700">The person’s goal</text><text x="32" y="418" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">“Show me sales by region.”</text><path d="M280 443 v26 m-7 -7 l7 7 7 -7" fill="none" stroke="#577f91" stroke-width="3"/><rect x="16" y="483" width="528" height="126" rx="9" fill="#f3f4f6"/><rect x="16" y="483" width="528" height="46" rx="9" fill="#304698"/><text x="32" y="514" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="700">The application’s operation</text><text x="32" y="561" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">“Make a pivot table</text><text x="32" y="592" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">of sales by region.”</text><rect x="16" y="633" width="528" height="126" rx="9" fill="#f3f4f6"/><rect x="16" y="633" width="528" height="46" rx="9" fill="#577f91"/><text x="32" y="664" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="700">The person’s goal</text><text x="32" y="711" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">“I am away next week;</text><text x="32" y="742" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">let people know.”</text><path d="M280 767 v26 m-7 -7 l7 7 7 -7" fill="none" stroke="#577f91" stroke-width="3"/><rect x="16" y="807" width="528" height="95" rx="9" fill="#f3f4f6"/><rect x="16" y="807" width="528" height="46" rx="9" fill="#304698"/><text x="32" y="838" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="700">The application’s operation</text><text x="32" y="885" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">“Turn on out of office.”</text></svg>