<svg xmlns="http://www.w3.org/2000/svg" width="800" height="326" viewBox="0 0 800 326" role="img" aria-label="Three paired examples of goal language and application language."><desc>Three paired examples of goal language and application language.</desc><rect width="800" height="326" fill="white"/>
<text x="30" y="30" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33" font-weight="700">The language of the job</text>
<text x="430" y="30" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33" font-weight="700">The application’s language</text>
<rect x="16" y="48" width="360" height="78" rx="7" fill="#f5f1ee"/>
<rect x="424" y="48" width="360" height="78" rx="7" fill="#47669c"/>
<text x="32" y="81" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">“Find a charger that works</text>
<text x="32" y="108" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">with this laptop.”</text>
<text x="440" y="81" font-family="Arial, sans-serif" font-size="22" fill="white">“Add the 65-watt USB-C</text>
<text x="440" y="108" font-family="Arial, sans-serif" font-size="22" fill="white">charger to my cart.”</text>
<path d="M386 87 H414 m-7 -7 l7 7 -7 7 M393 80 l-7 7 7 7" fill="none" stroke="#6b93a8" stroke-width="3"/>
<rect x="16" y="138" width="360" height="78" rx="7" fill="#f5f1ee"/>
<rect x="424" y="138" width="360" height="78" rx="7" fill="#47669c"/>
<text x="32" y="171" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">“Show me sales</text>
<text x="32" y="198" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">by region.”</text>
<text x="440" y="171" font-family="Arial, sans-serif" font-size="22" fill="white">“Make a pivot table</text>
<text x="440" y="198" font-family="Arial, sans-serif" font-size="22" fill="white">of sales by region.”</text>
<path d="M386 177 H414 m-7 -7 l7 7 -7 7 M393 170 l-7 7 7 7" fill="none" stroke="#6b93a8" stroke-width="3"/>
<rect x="16" y="228" width="360" height="78" rx="7" fill="#f5f1ee"/>
<rect x="424" y="228" width="360" height="78" rx="7" fill="#47669c"/>
<text x="32" y="261" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">“I am away next week;</text>
<text x="32" y="288" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">let people know.”</text>
<text x="440" y="275" font-family="Arial, sans-serif" font-size="22" fill="white">“Turn on out of office.”</text>
<path d="M386 267 H414 m-7 -7 l7 7 -7 7 M393 260 l-7 7 7 7" fill="none" stroke="#6b93a8" stroke-width="3"/>
</svg>