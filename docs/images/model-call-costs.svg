<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-label="A guarded change requires agent and guard model calls; persona and judge calls add to evaluation costs."><title>One request, several model calls</title><desc>A completion, due-date change, or deletion request can take this path: message, proposed tool call, parallel input and output guard checks, application execution, and reply. Persona runs add a model-generated message; evaluations add judge calls. Tools may repeat and guard answers may be cached.</desc><g font-family="Arial,sans-serif" fill="#1a1e33"><rect x="12" y="8" width="776" height="53" rx="5" fill="#f5f1ee"/><rect x="12" y="8" width="186" height="53" rx="5" fill="#2e4294"/><text x="24" y="39" font-size="16" fill="white">1. Message</text><text x="214" y="29" font-size="16">Person types a request</text><text x="214" y="51" font-size="14">Persona runs: EVALBASICS_PERSONA_MODEL</text><rect x="12" y="67" width="776" height="53" rx="5" fill="#f5f1ee"/><rect x="12" y="67" width="186" height="53" rx="5" fill="#2e4294"/><text x="24" y="98" font-size="16" fill="white">2. Proposed tool call</text><text x="214" y="88" font-size="16">Agent chooses a tool and its arguments</text><text x="214" y="110" font-size="14">EVALBASICS_MODEL</text><rect x="12" y="126" width="776" height="53" rx="5" fill="#f5f1ee"/><rect x="12" y="126" width="186" height="53" rx="5" fill="#2e4294"/><text x="24" y="157" font-size="16" fill="white">3. Guard checks</text><text x="214" y="147" font-size="16">Input and output checks run in parallel</text><text x="214" y="169" font-size="14">EVALBASICS_ACTION_GUARD_MODEL</text><rect x="12" y="185" width="776" height="53" rx="5" fill="#f5f1ee"/><rect x="12" y="185" width="186" height="53" rx="5" fill="#8ebfb3"/><text x="24" y="216" font-size="16" fill="#1a1e33">4. Execution</text><text x="214" y="206" font-size="16">Application code checks policy and applies the change</text><text x="214" y="228" font-size="14">No model call</text><rect x="12" y="244" width="776" height="53" rx="5" fill="#f5f1ee"/><rect x="12" y="244" width="186" height="53" rx="5" fill="#2e4294"/><text x="24" y="275" font-size="16" fill="white">5. Reply</text><text x="214" y="265" font-size="16">Agent reads tool results and adds its explanation</text><text x="214" y="287" font-size="14">EVALBASICS_MODEL</text><rect x="12" y="303" width="776" height="53" rx="5" fill="#f5f1ee"/><rect x="12" y="303" width="186" height="53" rx="5" fill="#2e4294"/><text x="24" y="334" font-size="16" fill="white">6. Evaluation</text><text x="214" y="324" font-size="16">Judges grade the recorded result in evaluation runs</text><text x="214" y="346" font-size="14">EVALBASICS_JUDGE_MODEL</text><text x="12" y="383" font-size="14">Example: a guarded change. Tool calls can repeat; unchanged guard answers may be cached.</text></g></svg>