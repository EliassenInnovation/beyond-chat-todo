<svg xmlns="http://www.w3.org/2000/svg" width="800" height="270" viewBox="0 0 800 270" role="img" aria-labelledby="title desc"><title id="title">Todo: check before merging</title><desc id="desc">When this guard is enabled, check the conversation: has the person identified which todos to combine? The check runs before the merge. Ellipses omit unrelated declaration details.</desc><rect width="800" height="270" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#48669d"/></marker></defs><g font-family="Arial, sans-serif" font-size="16" fill="#1a1e33"><text x="20" y="25" font-weight="bold">Todo: check before merging</text><rect x="20" y="40" width="420" height="210" rx="7" fill="#f2f1ee"/><rect x="20" y="40" width="420" height="38" rx="7" fill="#48669d"/><text x="36" y="65" fill="white" font-weight="bold">Registry declaration</text><rect x="480" y="40" width="300" height="210" rx="7" fill="#f2f1ee"/><rect x="480" y="40" width="300" height="38" rx="7" fill="#48669d"/><text x="496" y="65" fill="white" font-weight="bold">How it is used</text><text x="34" y="101" font-family="monospace" font-size="14" xml:space="preserve">@REGISTRY.action(</text><text x="34" y="123" font-family="monospace" font-size="14" xml:space="preserve">    &#x27;todos.merge&#x27;,</text><text x="34" y="145" font-family="monospace" font-size="14" xml:space="preserve">    ...</text><text x="34" y="167" font-family="monospace" font-size="14" xml:space="preserve">    guards=(&#x27;todos.merge_unnamed&#x27;,),</text><text x="34" y="189" font-family="monospace" font-size="14" xml:space="preserve">    ...</text><text x="34" y="211" font-family="monospace" font-size="14" xml:space="preserve">)</text><text x="496" y="104">When this guard is enabled,</text><text x="496" y="129">check the conversation:</text><text x="496" y="154">has the person identified</text><text x="496" y="179">which todos to combine?</text><text x="496" y="204">The check runs before the merge.</text><path d="M445 145H474" stroke="#48669d" stroke-width="2" marker-end="url(#arrow)"/></g></svg>