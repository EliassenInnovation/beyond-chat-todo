<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 255 1540 555" width="1540" height="555" role="img" aria-label="Capabilities first; the UI and the agent are built on them">
<rect width="1600" height="900" fill="#FFFFFF" />
<g transform="translate(0 50)">
<rect x="60" y="236" width="725" height="180" rx="8" fill="#F2F1EE" />
<path d="M60,286 V244 Q60,236 68,236 H777 Q785,236 785,244 V286 Z" fill="#6A92A7" />
<text x="84" y="269" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">The UI, for people</text>
<text x="84" y="334" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="22" fill="#1A1E33">Screens, buttons, and forms</text>
<text x="84" y="364" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="22" fill="#1A1E33">laid out for the jobs</text>
<rect x="815" y="236" width="725" height="180" rx="8" fill="#F2F1EE" />
<path d="M815,286 V244 Q815,236 823,236 H1532 Q1540,236 1540,244 V286 Z" fill="#48669D" />
<text x="839" y="269" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Prompt and tools, for the model</text>
<text x="839" y="334" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="22" fill="#1A1E33">A short prompt</text>
<text x="839" y="364" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="22" fill="#1A1E33">Tools in the job’s words and the app’s,</text>
<text x="839" y="394" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="22" fill="#1A1E33">often thin layers over the capabilities</text>
<rect x="60" y="446" width="1480" height="156" rx="8" fill="#F2F1EE" />
<path d="M60,496 V454 Q60,446 68,446 H1532 Q1540,446 1540,454 V496 Z" fill="#1A1E33" />
<text x="84" y="479" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Capabilities</text>
<rect x="90" y="520" width="220" height="52" rx="26" fill="#2E4394" />
<text x="200" y="553" text-anchor="middle" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Search products</text>
<rect x="330" y="520" width="220" height="52" rx="26" fill="#2E4394" />
<text x="440" y="553" text-anchor="middle" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Get a product</text>
<rect x="570" y="520" width="220" height="52" rx="26" fill="#2E4394" />
<text x="680" y="553" text-anchor="middle" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Add to cart</text>
<rect x="810" y="520" width="220" height="52" rx="26" fill="#2E4394" />
<text x="920" y="553" text-anchor="middle" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Place an order</text>
<rect x="1050" y="520" width="220" height="52" rx="26" fill="#2E4394" />
<text x="1160" y="553" text-anchor="middle" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Cancel an order</text>
<rect x="1290" y="520" width="220" height="52" rx="26" fill="#2E4394" />
<text x="1400" y="553" text-anchor="middle" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Open a repair ticket</text>
<path d="M60,616 Q60,636.0 86,636.0 L774,636.0 Q800,636.0 800,656 Q800,636.0 826,636.0 L1514,636.0 Q1540,636.0 1540,616" fill="none" stroke="#E6B573" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<text x="800" y="700" text-anchor="middle" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#1A1E33">Understanding the people’s jobs and the app’s objects and actions</text>
<text x="800" y="736" text-anchor="middle" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="22" fill="#1A1E33">The foundation: it decides which tools to offer, which capabilities they need, and what words to use.</text>
</g>
