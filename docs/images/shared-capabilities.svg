<svg xmlns="http://www.w3.org/2000/svg" width="800" height="574" viewBox="0 0 800 574" role="img" aria-label="The UI and agent tools sit side by side above shared capabilities, supported by understanding users and their jobs."><desc>The UI and agent tools sit side by side above shared capabilities, supported by understanding users and their jobs.</desc><rect width="800" height="574" fill="white"/><rect x="16" y="16" width="376" height="160" rx="7" fill="#f2f1ee"/><rect x="16" y="16" width="376" height="42" rx="7" fill="#6a92a7"/><text xml:space="preserve" x="30" y="44" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="700">The UI, for people</text><text xml:space="preserve" x="30" y="88" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">Screens, buttons and forms</text><text xml:space="preserve" x="30" y="115" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">organized around people’s jobs</text><rect x="408" y="16" width="376" height="160" rx="7" fill="#f2f1ee"/><rect x="408" y="16" width="376" height="42" rx="7" fill="#304698"/><text xml:space="preserve" x="422" y="44" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="700">Tools, for the agent</text><text xml:space="preserve" x="422" y="88" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">A short prompt; tool names,</text><text xml:space="preserve" x="422" y="115" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">inputs and descriptions</text><text xml:space="preserve" x="422" y="142" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">that connect requests to operations</text><path d="M204 184 V208 H596 V184 M400 208 V234 m-7 -7 l7 7 7 -7" fill="none" stroke="#6a92a7" stroke-width="3"/><rect x="16" y="246" width="768" height="178" rx="7" fill="#f2f1ee"/><rect x="16" y="246" width="768" height="42" rx="7" fill="#304698"/><text xml:space="preserve" x="30" y="274" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="700">Shared application capabilities</text><text xml:space="preserve" x="30" y="318" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">Search products     Check compatibility     Add to cart</text><text xml:space="preserve" x="30" y="345" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">Place an order        Cancel an order        Open a repair ticket</text><text xml:space="preserve" x="30" y="372" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">One implementation and data; caller-specific permissions</text><path d="M32 440 Q32 458 60 458 H375 Q400 458 400 476 Q400 458 425 458 H740 Q768 458 768 440" fill="none" stroke="#6a92a7" stroke-width="3"/><text xml:space="preserve" x="64" y="512" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33" font-weight="700">Understanding people’s jobs and the application’s operations</text><text xml:space="preserve" x="64" y="547" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">This determines which capabilities to offer and how to describe them.</text></svg>