<text x="30" y="88" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#1a1e33" text-anchor="start">Screens, buttons and forms</text>
<text x="30" y="115" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#1a1e33" text-anchor="start">organized around people’s jobs</text>
<rect x="408" y="16" width="376" height="134" rx="7" fill="#f2f1ee"/>
<rect x="408" y="16" width="376" height="42" rx="7" fill="#304698"/>
