<svg xmlns="http://www.w3.org/2000/svg" width="560" height="647" viewBox="0 0 560 647" role="img" aria-label="The UI and agent call shared capabilities with caller-specific permissions. Understanding users and their jobs guides the design."><desc>The UI and agent call shared capabilities with caller-specific permissions. Understanding users and their jobs guides the design.</desc><rect width="560" height="647" fill="white"/><rect x="16" y="16" width="528" height="95" rx="9" fill="#f3f4f6"/><rect x="16" y="16" width="528" height="46" rx="9" fill="#304698"/><text x="32" y="47" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="700">The UI, for people</text><text x="32" y="94" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">Screens, buttons and forms</text><rect x="16" y="127" width="528" height="126" rx="9" fill="#f3f4f6"/><rect x="16" y="127" width="528" height="46" rx="9" fill="#304698"/><text x="32" y="158" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="700">Tools, for the agent</text><text x="32" y="205" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">Names, inputs and descriptions</text><text x="32" y="236" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">that connect requests to operations</text><path d="M280 261 v26 m-7 -7 l7 7 7 -7" fill="none" stroke="#577f91" stroke-width="3"/><text x="305" y="282" font-family="Arial, sans-serif" font-size="18" fill="#577f91">Both call</text><rect x="16" y="301" width="528" height="188" rx="9" fill="#f3f4f6"/><rect x="16" y="301" width="528" height="46" rx="9" fill="#304698"/><text x="32" y="332" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="700">Shared application capabilities</text><text x="32" y="379" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">Search products · Check compatibility</text><text x="32" y="410" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">Add to cart · Place an order</text><text x="32" y="441" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">One implementation and data source</text><text x="32" y="472" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">Permissions appropriate to each caller</text><rect x="16" y="505" width="528" height="126" rx="9" fill="#f3f4f6"/><rect x="16" y="505" width="528" height="46" rx="9" fill="#577f91"/><text x="32" y="536" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="700">The design starts with understanding</text><text x="32" y="583" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">What people need to do</text><text x="32" y="614" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">The application’s objects and operations</text></svg>