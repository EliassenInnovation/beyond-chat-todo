<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">Shared application capabilities</title><desc id="desc">The UI and agent tools use shared operations with permissions for each caller. Six example capabilities appear as individual pills.</desc><rect width="800" height="500" fill="white"/>
<rect x="16" y="16" width="376" height="134" rx="7" fill="#f2f1ee"/>
<rect x="16" y="16" width="376" height="42" rx="7" fill="#6a92a7"/>
