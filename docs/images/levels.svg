<svg xmlns="http://www.w3.org/2000/svg" width="560" height="817" viewBox="0 0 560 817" role="img" aria-label="Six levels of assistance: search, AI-assisted search, instructions, demonstration, execution and combining capabilities into new workflows."><desc>Six levels of assistance: search, AI-assisted search, instructions, demonstration, execution and combining capabilities into new workflows.</desc><rect width="560" height="817" fill="white"/><rect x="16" y="16" width="528" height="126" rx="9" fill="#f3f4f6"/><rect x="16" y="16" width="528" height="46" rx="9" fill="#577f91"/><text x="32" y="47" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="700">1. Find help</text><text x="32" y="94" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">Keywords and a search box</text><text x="32" y="125" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">The person reads and does the work.</text><rect x="16" y="154" width="528" height="126" rx="9" fill="#f3f4f6"/><rect x="16" y="154" width="528" height="46" rx="9" fill="#577f91"/><text x="32" y="185" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="700">2. Find help with AI</text><text x="32" y="232" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">AI retrieves relevant instructions.</text><text x="32" y="263" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">The person still does the work.</text><rect x="16" y="292" width="528" height="126" rx="9" fill="#f3f4f6"/><rect x="16" y="292" width="528" height="46" rx="9" fill="#304698"/><text x="32" y="323" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="700">3. Tell me how</text><text x="32" y="370" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">Explain in the application’s own words:</text><text x="32" y="401" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">“Click Active below the list.”</text><rect x="16" y="430" width="528" height="95" rx="9" fill="#f3f4f6"/><rect x="16" y="430" width="528" height="46" rx="9" fill="#304698"/><text x="32" y="461" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="700">4. Show me how</text><text x="32" y="508" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">Point to the control on the screen.</text><rect x="16" y="537" width="528" height="126" rx="9" fill="#f3f4f6"/><rect x="16" y="537" width="528" height="46" rx="9" fill="#304698"/><text x="32" y="568" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="700">5. Do it for me</text><text x="32" y="615" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">Perform the authorized operation</text><text x="32" y="646" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">and confirm what changed.</text><rect x="16" y="675" width="528" height="126" rx="9" fill="#f3f4f6"/><rect x="16" y="675" width="528" height="46" rx="9" fill="#3c7369"/><text x="32" y="706" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="700">6. Do something new for me</text><text x="32" y="753" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">Combine existing capabilities into</text><text x="32" y="784" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">a workflow with no dedicated button.</text></svg>