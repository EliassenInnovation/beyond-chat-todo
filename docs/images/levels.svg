<svg xmlns="http://www.w3.org/2000/svg" width="800" height="410" viewBox="0 0 800 410" role="img" aria-label="Six levels of assistance, grouped into finding help, working with a partner, and composing new workflows."><desc>Six levels of assistance, grouped into finding help, working with a partner, and composing new workflows.</desc><rect width="800" height="410" fill="white" /><rect x="16" y="10" width="768" height="60" rx="7" fill="#f2f1ee" /><rect x="16" y="10" width="54" height="60" rx="7" fill="#6a92a7" /><text xml:space="preserve" x="32" y="49" font-family="Arial, sans-serif" font-size="28" fill="white" font-weight="700">1</text><text xml:space="preserve" x="90" y="49" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33" font-weight="700">Help search</text><text xml:space="preserve" x="370" y="33" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">Keywords and a search box.</text><text xml:space="preserve" x="370" y="57" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">The person reads and does the work.</text><rect x="16" y="76" width="768" height="60" rx="7" fill="#f2f1ee" /><rect x="16" y="76" width="54" height="60" rx="7" fill="#6a92a7" /><text xml:space="preserve" x="32" y="115" font-family="Arial, sans-serif" font-size="28" fill="white" font-weight="700">2</text><text xml:space="preserve" x="90" y="115" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33" font-weight="700">Help search with AI</text><text xml:space="preserve" x="370" y="99" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">Find relevant instructions.</text><text xml:space="preserve" x="370" y="123" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">The person still does the work.</text><rect x="16" y="142" width="768" height="60" rx="7" fill="#f2f1ee" /><rect x="16" y="142" width="54" height="60" rx="7" fill="#304698" /><text xml:space="preserve" x="32" y="181" font-family="Arial, sans-serif" font-size="28" fill="white" font-weight="700">3</text><text xml:space="preserve" x="90" y="181" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33" font-weight="700">Tell me how</text><text xml:space="preserve" x="370" y="165" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">Use the application’s own words:</text><text xml:space="preserve" x="370" y="189" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">“Click Active below the list.”</text><rect x="16" y="208" width="768" height="60" rx="7" fill="#f2f1ee" /><rect x="16" y="208" width="54" height="60" rx="7" fill="#304698" /><text xml:space="preserve" x="32" y="247" font-family="Arial, sans-serif" font-size="28" fill="white" font-weight="700">4</text><text xml:space="preserve" x="90" y="247" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33" font-weight="700">Show me how</text><text xml:space="preserve" x="370" y="247" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">Point to the control on the screen.</text><rect x="16" y="274" width="768" height="60" rx="7" fill="#f2f1ee" /><rect x="16" y="274" width="54" height="60" rx="7" fill="#304698" /><text xml:space="preserve" x="32" y="313" font-family="Arial, sans-serif" font-size="28" fill="white" font-weight="700">5</text><text xml:space="preserve" x="90" y="313" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33" font-weight="700">Do it for me</text><text xml:space="preserve" x="370" y="297" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">Perform the authorized operation</text><text xml:space="preserve" x="370" y="321" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">and confirm what changed.</text><rect x="16" y="340" width="768" height="60" rx="7" fill="#f2f1ee" /><rect x="16" y="340" width="54" height="60" rx="7" fill="#3c7369" /><text xml:space="preserve" x="32" y="379" font-family="Arial, sans-serif" font-size="28" fill="white" font-weight="700">6</text><text xml:space="preserve" x="90" y="379" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33" font-weight="700">Do something new</text><text xml:space="preserve" x="370" y="363" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">Combine capabilities into a workflow</text><text xml:space="preserve" x="370" y="387" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">with no dedicated button.</text></svg>
