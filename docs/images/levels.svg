<svg xmlns="http://www.w3.org/2000/svg" width="800" height="696" viewBox="0 0 800 696" role="img" aria-label="Six levels of assistance, grouped into finding help, working with a partner, and composing new workflows."><desc>Six levels of assistance, grouped into finding help, working with a partner, and composing new workflows.</desc><rect width="800" height="696" fill="white"/><rect x="16" y="16" width="768" height="98" rx="7" fill="#f2f1ee"/><rect x="16" y="16" width="54" height="98" rx="7" fill="#3c7369"/><text xml:space="preserve" x="32" y="74" font-family="Arial, sans-serif" font-size="28" fill="white" font-weight="700">6</text><text xml:space="preserve" x="90" y="56" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33" font-weight="700">Do something new</text><text xml:space="preserve" x="370" y="53" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">Combine capabilities into a workflow</text><text xml:space="preserve" x="370" y="80" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">with no dedicated button.</text><rect x="16" y="128" width="768" height="98" rx="7" fill="#f2f1ee"/><rect x="16" y="128" width="54" height="98" rx="7" fill="#304698"/><text xml:space="preserve" x="32" y="186" font-family="Arial, sans-serif" font-size="28" fill="white" font-weight="700">5</text><text xml:space="preserve" x="90" y="168" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33" font-weight="700">Do it for me</text><text xml:space="preserve" x="370" y="165" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">Perform the authorized operation</text><text xml:space="preserve" x="370" y="192" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">and confirm what changed.</text><rect x="16" y="240" width="768" height="98" rx="7" fill="#f2f1ee"/><rect x="16" y="240" width="54" height="98" rx="7" fill="#304698"/><text xml:space="preserve" x="32" y="298" font-family="Arial, sans-serif" font-size="28" fill="white" font-weight="700">4</text><text xml:space="preserve" x="90" y="280" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33" font-weight="700">Show me how</text><text xml:space="preserve" x="370" y="277" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">Point to the control on the screen.</text><rect x="16" y="352" width="768" height="98" rx="7" fill="#f2f1ee"/><rect x="16" y="352" width="54" height="98" rx="7" fill="#304698"/><text xml:space="preserve" x="32" y="410" font-family="Arial, sans-serif" font-size="28" fill="white" font-weight="700">3</text><text xml:space="preserve" x="90" y="392" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33" font-weight="700">Tell me how</text><text xml:space="preserve" x="370" y="389" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">Use the application’s own words:</text><text xml:space="preserve" x="370" y="416" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">“Click Active below the list.”</text><rect x="16" y="464" width="768" height="98" rx="7" fill="#f2f1ee"/><rect x="16" y="464" width="54" height="98" rx="7" fill="#6a92a7"/><text xml:space="preserve" x="32" y="522" font-family="Arial, sans-serif" font-size="28" fill="white" font-weight="700">2</text><text xml:space="preserve" x="90" y="504" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33" font-weight="700">Help search with AI</text><text xml:space="preserve" x="370" y="501" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">Find relevant instructions.</text><text xml:space="preserve" x="370" y="528" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">The person still does the work.</text><rect x="16" y="576" width="768" height="98" rx="7" fill="#f2f1ee"/><rect x="16" y="576" width="54" height="98" rx="7" fill="#6a92a7"/><text xml:space="preserve" x="32" y="634" font-family="Arial, sans-serif" font-size="28" fill="white" font-weight="700">1</text><text xml:space="preserve" x="90" y="616" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33" font-weight="700">Help search</text><text xml:space="preserve" x="370" y="613" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">Keywords and a search box.</text><text xml:space="preserve" x="370" y="640" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">The person reads and does the work.</text></svg>