<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-label="A lost reply leads to a retry with the same change ID and the original saved outcome."><desc>A lost reply leads to a retry with the same change ID and the original saved outcome.</desc><style>text{font-family:Arial,sans-serif;fill:#1A1E33;font-size:20px}.head{fill:white;font-weight:700}.label{font-weight:700}.small{font-size:18px}</style><rect width="800" height="400" fill="white"/><rect x="48" y="12" width="220" height="42" rx="5" fill="#2E4294"/><rect x="532" y="12" width="220" height="42" rx="5" fill="#2E4294"/><text x="124" y="40" class="head">Client</text><text x="584" y="40" class="head">Application</text><path d="M158 60V350 M642 60V350" stroke="#8EBFB3" stroke-width="3"/><path d="M158 92H642" stroke="#2E4294" stroke-width="2" fill="none"/><path d="M633 86L642 92L633 98" stroke="#2E4294" fill="none" stroke-width="2"/><text x="200" y="82" class="small">1. Send change C-42</text><path d="M642 198H320" stroke="#2E4294" stroke-width="2" stroke-dasharray="6 5" fill="none"/><path d="M308 191L322 205 M308 205L322 191" stroke="#2E4294" stroke-width="2"/><text x="200" y="188" class="small">3. Reply lost in transit</text><path d="M158 258H642" stroke="#2E4294" stroke-width="2" fill="none"/><path d="M633 252L642 258L633 264" stroke="#2E4294" fill="none" stroke-width="2"/><text x="200" y="248" class="small">4. Retry change C-42</text><path d="M642 326H158" stroke="#2E4294" stroke-width="2" fill="none"/><path d="M167 320L158 326L167 332" stroke="#2E4294" fill="none" stroke-width="2"/><text x="200" y="316" class="small">5. Return the first result</text><rect x="500" y="110" width="284" height="48" rx="5" fill="#8EBFB3"/><text x="514" y="140" class="small">2. Save; record the result</text><text x="518" y="286" class="small">C-42 already completed</text><text x="158" y="380" class="label">Same change ID across retries; a separate ID for each attempt.</text></svg>