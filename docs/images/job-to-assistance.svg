<svg xmlns="http://www.w3.org/2000/svg" width="800" height="384" viewBox="0 0 800 384" role="img" aria-labelledby="title desc"><title id="title">From a user difficulty to useful assistance</title><desc id="desc">An illustrative appointment example, in four clockwise steps: repeated support calls, keeping an appointment when plans change, help finding and arranging a suitable time, and checking that one correct booking remains.</desc><rect width="800" height="384" fill="white"/>
<rect x="16" y="16" width="354" height="148" rx="7" fill="#f2f1ee"/><rect x="16" y="16" width="354" height="42" rx="7" fill="#6a829b"/>
<text x="30" y="44" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="white">1. Where people struggle</text>
<text x="30" y="89" font-family="Arial, sans-serif" font-size="21" fill="#1a1e33">Repeated support calls</text>
<text x="30" y="116" font-family="Arial, sans-serif" font-size="21" fill="#1a1e33">to change an appointment</text>
<text x="30" y="143" font-family="Arial, sans-serif" font-size="21" fill="#1a1e33">when plans change.</text>
<rect x="430" y="16" width="354" height="148" rx="7" fill="#f2f1ee"/><rect x="430" y="16" width="354" height="42" rx="7" fill="#304698"/>
<text x="444" y="44" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="white">2. What they need</text>
<text x="444" y="89" font-family="Arial, sans-serif" font-size="21" fill="#1a1e33">Keep the appointment</text>
<text x="444" y="116" font-family="Arial, sans-serif" font-size="21" fill="#1a1e33">at a time that works</text>
<text x="444" y="143" font-family="Arial, sans-serif" font-size="21" fill="#1a1e33">with their changed plans.</text>
<rect x="430" y="220" width="354" height="148" rx="7" fill="#f2f1ee"/><rect x="430" y="220" width="354" height="42" rx="7" fill="#304698"/>
<text x="444" y="248" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="white">3. Where an agent helps</text>
<text x="444" y="293" font-family="Arial, sans-serif" font-size="21" fill="#1a1e33">Find suitable times</text>
<text x="444" y="320" font-family="Arial, sans-serif" font-size="21" fill="#1a1e33">and arrange the change</text>
<text x="444" y="347" font-family="Arial, sans-serif" font-size="21" fill="#1a1e33">through the application.</text>
<rect x="16" y="220" width="354" height="148" rx="7" fill="#f2f1ee"/><rect x="16" y="220" width="354" height="42" rx="7" fill="#39766e"/>
<text x="30" y="248" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="white">4. What success looks like</text>
<text x="30" y="293" font-family="Arial, sans-serif" font-size="21" fill="#1a1e33">One suitable time confirmed;</text>
<text x="30" y="320" font-family="Arial, sans-serif" font-size="21" fill="#1a1e33">participants informed;</text>
<text x="30" y="347" font-family="Arial, sans-serif" font-size="21" fill="#1a1e33">no duplicate booking.</text>
<path d="M380 90 H418 m-8 -8 l8 8 -8 8 M607 174 V208 m-8 -8 l8 8 8 -8 M420 294 H382 m8 -8 l-8 8 8 8" fill="none" stroke="#6a829b" stroke-width="3"/>
</svg>
