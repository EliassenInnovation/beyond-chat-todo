<svg xmlns="http://www.w3.org/2000/svg" width="800" height="308" viewBox="0 0 800 308" role="img" aria-label="Impact and reversibility guide the safeguards an application chooses."><desc>Impact and reversibility guide the safeguards an application chooses.</desc><style>text{font-family:Arial,sans-serif;fill:#1A1E33;font-size:20px}.head{fill:white;font-weight:700}.label{font-weight:700}.small{font-size:18px}</style><rect width="800" height="308" fill="white"/><rect x="152" y="12" width="312" height="44" rx="5" fill="#2E4294"/><text x="168" y="41" class="head">Easy to undo</text><rect x="472" y="12" width="312" height="44" rx="5" fill="#2E4294"/><text x="488" y="41" class="head">Difficult to undo</text><text x="12" y="112" class="label">Small impact</text><rect x="152" y="68" width="312" height="108" rx="5" fill="#F5F1EE"/><rect x="472" y="68" width="312" height="108" rx="5" fill="#F5F1EE"/><text x="12" y="232" class="label">Large impact</text><rect x="152" y="188" width="312" height="108" rx="5" fill="#F5F1EE"/><rect x="472" y="188" width="312" height="108" rx="5" fill="#F5F1EE"/><text x="168" y="96" class="label">Move one task</text><text x="168" y="123" class="small">Direct action may be suitable</text><text x="168" y="150" class="small">when policy permits.</text><text x="488" y="96" class="label">Delete one record</text><text x="488" y="123" class="small">Show the exact item and</text><text x="488" y="150" class="small">confirm where required.</text><text x="168" y="216" class="label">Reschedule a full day</text><text x="168" y="243" class="small">Preview the affected items;</text><text x="168" y="270" class="small">consider approval.</text><text x="488" y="216" class="label">Delete a customer archive</text><text x="488" y="243" class="small">Review the full scope and</text><text x="488" y="270" class="small">require explicit approval.</text></svg>