<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280" role="img" aria-label="A deletion proposal waits for the person's approval; agent approval and changed proposals are refused.">
<title>Deletion approval in the Todo sample</title>
<desc>The agent requests deletion. Application code creates a proposal and leaves the todo unchanged. The person approves through the screen. Code checks the proposal and deletes the todo. An agent attempting approval is refused, as is approval after the todo details change.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#2e4294"/></marker></defs>
<g font-family="Arial,sans-serif" font-size="16" fill="#1a1e33">
<rect x="8" y="20" width="178" height="108" rx="6" fill="#f5f1ee"/><path d="M14 20H180Q186 20 186 26V54H8V26Q8 20 14 20" fill="#2e4294"/><text x="20" y="43" fill="white">Agent</text><text x="20" y="80">request_delete</text><text x="20" y="104">Names the todo</text><rect x="210" y="20" width="178" height="108" rx="6" fill="#f5f1ee"/><path d="M216 20H382Q388 20 388 26V54H210V26Q210 20 216 20" fill="#2e4294"/><text x="222" y="43" fill="white">Application code</text><text x="222" y="80">Creates a proposal</text><text x="222" y="104">The todo stays</text><rect x="412" y="20" width="178" height="108" rx="6" fill="#f5f1ee"/><path d="M418 20H584Q590 20 590 26V54H412V26Q412 20 418 20" fill="#2e4294"/><text x="424" y="43" fill="white">Person</text><text x="424" y="80">Clicks "Approve"</text><text x="424" y="104">Caller: person</text><rect x="614" y="20" width="178" height="108" rx="6" fill="#f5f1ee"/><path d="M620 20H786Q792 20 792 26V54H614V26Q614 20 620 20" fill="#2e4294"/><text x="626" y="43" fill="white">Application code</text><text x="626" y="80">Checks proposal</text><text x="626" y="104">Deletes the todo</text><path d="M187 75h20" fill="none" stroke="#2e4294" stroke-width="2" marker-end="url(#arrow)"/><path d="M389 75h20" fill="none" stroke="#2e4294" stroke-width="2" marker-end="url(#arrow)"/><path d="M591 75h20" fill="none" stroke="#2e4294" stroke-width="2" marker-end="url(#arrow)"/><rect x="8" y="158" width="380" height="90" rx="6" fill="#f5f1ee"/>
<text x="22" y="184" fill="#9b3434">Agent calls todos.approve</text><text x="22" y="210">Refused: only the person may approve.</text><text x="22" y="234">Caller identity comes from application code.</text>
<rect x="412" y="158" width="380" height="90" rx="6" fill="#f5f1ee"/>
<text x="426" y="184" fill="#9b3434">Todo changes before approval</text><text x="426" y="210">Refused: the proposal is out of date.</text><text x="426" y="234">Request a new proposal for the current todo.</text>
</g></svg>