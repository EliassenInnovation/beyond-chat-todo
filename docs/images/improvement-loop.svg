<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 275 1540 535" width="1540" height="535" role="img" aria-label="The improvement loop">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#48669D" /></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6A92A7" /></marker></defs>
<rect width="1600" height="900" fill="#FFFFFF" />
<rect x="60" y="300" width="273" height="210" rx="8" fill="#F2F1EE" />
<path d="M60,352 V308 Q60,300 68,300 H325 Q333,300 333,308 V352 Z" fill="#2E4394" />
<text x="196.5" y="334" text-anchor="middle" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">1  The job</text>
<text x="82" y="396" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="27" font-weight="700" fill="#1A1E33">What the user</text>
<text x="82" y="428" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="27" font-weight="700" fill="#1A1E33">wants to do</text>
<text x="82" y="466" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="21" fill="#1A1E33">From the makers,</text>
<text x="82" y="492" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="21" fill="#1A1E33">real use, or a persona</text>
<rect x="361" y="300" width="273" height="210" rx="8" fill="#F2F1EE" />
<path d="M361,352 V308 Q361,300 369,300 H626 Q634,300 634,308 V352 Z" fill="#2E4394" />
<text x="497.5" y="334" text-anchor="middle" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">2  Capture</text>
<text x="383" y="396" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="27" font-weight="700" fill="#1A1E33">It becomes</text>
<text x="383" y="428" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="27" font-weight="700" fill="#1A1E33">a test case</text>
<text x="383" y="466" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="21" fill="#1A1E33">Added to your evals,</text>
<text x="383" y="492" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="21" fill="#1A1E33">run with all the others</text>
<line x1="336" y1="405" x2="356" y2="405" stroke="#48669D" stroke-width="3" marker-end="url(#a)" />
<rect x="662" y="300" width="273" height="210" rx="8" fill="#F2F1EE" />
<path d="M662,352 V308 Q662,300 670,300 H927 Q935,300 935,308 V352 Z" fill="#48669D" />
<text x="798.5" y="334" text-anchor="middle" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">3  Measure</text>
<text x="684" y="396" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="27" font-weight="700" fill="#1A1E33">Run it,</text>
<text x="684" y="428" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="27" font-weight="700" fill="#1A1E33">often</text>
<text x="684" y="466" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="21" fill="#1A1E33">A model varies:</text>
<text x="684" y="492" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="21" fill="#1A1E33">report a rate</text>
<line x1="637" y1="405" x2="657" y2="405" stroke="#48669D" stroke-width="3" marker-end="url(#a)" />
<rect x="963" y="300" width="273" height="210" rx="8" fill="#F2F1EE" />
<path d="M963,352 V308 Q963,300 971,300 H1228 Q1236,300 1236,308 V352 Z" fill="#48669D" />
<text x="1099.5" y="334" text-anchor="middle" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">4  Fix</text>
<text x="985" y="396" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="27" font-weight="700" fill="#1A1E33">Fix the underlying</text>
<text x="985" y="428" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="27" font-weight="700" fill="#1A1E33">problem</text>
<text x="985" y="466" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="21" fill="#1A1E33">Generalize the fix,</text>
<text x="985" y="492" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="21" fill="#1A1E33">not just this test case</text>
<line x1="938" y1="405" x2="958" y2="405" stroke="#48669D" stroke-width="3" marker-end="url(#a)" />
<rect x="1264" y="300" width="273" height="210" rx="8" fill="#F2F1EE" />
<path d="M1264,352 V308 Q1264,300 1272,300 H1529 Q1537,300 1537,308 V352 Z" fill="#8FBFB3" />
<text x="1400.5" y="334" text-anchor="middle" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#1A1E33">5  Measure again</text>
<text x="1286" y="396" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="27" font-weight="700" fill="#1A1E33">Did it</text>
<text x="1286" y="428" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="27" font-weight="700" fill="#1A1E33">generalize?</text>
<text x="1286" y="466" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="21" fill="#1A1E33">A held-out phrasing</text>
<text x="1286" y="492" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="21" fill="#1A1E33">the fix never saw</text>
<line x1="1239" y1="405" x2="1259" y2="405" stroke="#48669D" stroke-width="3" marker-end="url(#a)" />
<rect x="400" y="620" width="800" height="150" rx="8" fill="#F2F1EE" />
<path d="M400,672 V628 Q400,620 408,620 H1192 Q1200,620 1200,628 V672 Z" fill="#6A92A7" />
<text x="800" y="654" text-anchor="middle" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">6  Audit</text>
<text x="428" y="714" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="27" font-weight="700" fill="#1A1E33">Audit and fix the evals, not just the agent</text>
<text x="428" y="748" font-family="Calibri, Carlito, 'Segoe UI', sans-serif" font-size="21" fill="#1A1E33">Read failures and some passes. Fix wrong judges, rubrics, and test cases.</text>
<polyline points="1400,513 1400,695 1205,695" fill="none" stroke="#6A92A7" stroke-width="3" marker-end="url(#r)" />
<polyline points="397,695 196,695 196,517" fill="none" stroke="#6A92A7" stroke-width="3" marker-end="url(#r)" />
</svg>