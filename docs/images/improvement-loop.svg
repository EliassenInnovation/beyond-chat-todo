<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1059" viewBox="0 0 560 1059" role="img" aria-label="Evaluation proceeds from user jobs through cases, repeated measurements, fixes, independent checks and review of the evaluations themselves."><desc>Evaluation proceeds from user jobs through cases, repeated measurements, fixes, independent checks and review of the evaluations themselves.</desc><rect width="560" height="1059" fill="white"/><rect x="16" y="16" width="528" height="126" rx="9" fill="#f3f4f6"/><rect x="16" y="16" width="528" height="46" rx="9" fill="#304698"/><text x="32" y="47" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="700">1. Identify the job</text><text x="32" y="94" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">What does the person need to do?</text><text x="32" y="125" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">Use real needs and exploratory findings.</text><path d="M280 150 v26 m-7 -7 l7 7 7 -7" fill="none" stroke="#577f91" stroke-width="3"/><rect x="16" y="190" width="528" height="126" rx="9" fill="#f3f4f6"/><rect x="16" y="190" width="528" height="46" rx="9" fill="#304698"/><text x="32" y="221" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="700">2. Capture a test case</text><text x="32" y="268" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">Record the request, starting state</text><text x="32" y="299" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">and expected outcome.</text><path d="M280 324 v26 m-7 -7 l7 7 7 -7" fill="none" stroke="#577f91" stroke-width="3"/><rect x="16" y="364" width="528" height="126" rx="9" fill="#f3f4f6"/><rect x="16" y="364" width="528" height="46" rx="9" fill="#304698"/><text x="32" y="395" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="700">3. Measure</text><text x="32" y="442" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">Run comparable attempts.</text><text x="32" y="473" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">Inspect outcomes and variation.</text><path d="M280 498 v26 m-7 -7 l7 7 7 -7" fill="none" stroke="#577f91" stroke-width="3"/><rect x="16" y="538" width="528" height="126" rx="9" fill="#f3f4f6"/><rect x="16" y="538" width="528" height="46" rx="9" fill="#304698"/><text x="32" y="569" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="700">4. Fix the underlying problem</text><text x="32" y="616" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">Improve the capability, context or prompt</text><text x="32" y="647" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">for this kind of request.</text><path d="M280 672 v26 m-7 -7 l7 7 7 -7" fill="none" stroke="#577f91" stroke-width="3"/><rect x="16" y="712" width="528" height="126" rx="9" fill="#f3f4f6"/><rect x="16" y="712" width="528" height="46" rx="9" fill="#304698"/><text x="32" y="743" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="700">5. Check whether the fix generalizes</text><text x="32" y="790" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">Use a separately held-out example.</text><text x="32" y="821" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">Check other affected jobs too.</text><path d="M280 846 v26 m-7 -7 l7 7 7 -7" fill="none" stroke="#577f91" stroke-width="3"/><rect x="16" y="886" width="528" height="157" rx="9" fill="#f3f4f6"/><rect x="16" y="886" width="528" height="46" rx="9" fill="#577f91"/><text x="32" y="917" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="700">6. Review the evaluations</text><text x="32" y="964" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">Read failures and a sample of passes.</text><text x="32" y="995" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">Correct faulty judges or criteria.</text><text x="32" y="1026" font-family="Arial, sans-serif" font-size="22" fill="#1a1e33">Use the findings in the next cycle.</text></svg>