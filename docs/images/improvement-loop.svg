<svg xmlns="http://www.w3.org/2000/svg" width="800" height="506" viewBox="0 0 800 506" role="img" aria-label="Evaluation cycle: identify a job, capture a case, measure, fix, check generalization, and audit evaluations."><desc>Evaluation cycle: identify a job, capture a case, measure, fix, check generalization, and audit evaluations.</desc><rect width="800" height="506" fill="white"/><rect x="16" y="16" width="236" height="220" rx="7" fill="#f2f1ee"/><rect x="16" y="16" width="236" height="42" rx="7" fill="#304698"/><text xml:space="preserve" x="30" y="44" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="700">1. The job</text><text xml:space="preserve" x="30" y="88" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">What does the person</text><text xml:space="preserve" x="30" y="115" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">want to accomplish?</text><text xml:space="preserve" x="30" y="142" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">Use real needs and</text><text xml:space="preserve" x="30" y="169" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">exploratory findings.</text><rect x="282" y="16" width="236" height="220" rx="7" fill="#f2f1ee"/><rect x="282" y="16" width="236" height="42" rx="7" fill="#304698"/><text xml:space="preserve" x="296" y="44" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="700">2. Capture</text><text xml:space="preserve" x="296" y="88" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">Record the request,</text><text xml:space="preserve" x="296" y="115" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">starting state and</text><text xml:space="preserve" x="296" y="142" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">expected outcome.</text><rect x="548" y="16" width="236" height="220" rx="7" fill="#f2f1ee"/><rect x="548" y="16" width="236" height="42" rx="7" fill="#304698"/><text xml:space="preserve" x="562" y="44" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="700">3. Measure</text><text xml:space="preserve" x="562" y="88" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">Run comparable</text><text xml:space="preserve" x="562" y="115" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">attempts. Inspect</text><text xml:space="preserve" x="562" y="142" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">outcomes and</text><text xml:space="preserve" x="562" y="169" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">variation.</text><rect x="548" y="268" width="236" height="220" rx="7" fill="#f2f1ee"/><rect x="548" y="268" width="236" height="42" rx="7" fill="#304698"/><text xml:space="preserve" x="562" y="296" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="700">4. Fix</text><text xml:space="preserve" x="562" y="340" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">Improve the capability,</text><text xml:space="preserve" x="562" y="367" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">context or prompt for</text><text xml:space="preserve" x="562" y="394" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">this kind of request.</text><rect x="282" y="268" width="236" height="220" rx="7" fill="#f2f1ee"/><rect x="282" y="268" width="236" height="42" rx="7" fill="#304698"/><text xml:space="preserve" x="296" y="296" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="700">5. Measure again</text><text xml:space="preserve" x="296" y="340" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">Check a held-out case</text><text xml:space="preserve" x="296" y="367" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">and other affected jobs.</text><text xml:space="preserve" x="296" y="394" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">Did the fix generalize?</text><rect x="16" y="268" width="236" height="220" rx="7" fill="#f2f1ee"/><rect x="16" y="268" width="236" height="42" rx="7" fill="#6a92a7"/><text xml:space="preserve" x="30" y="296" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="700">6. Audit</text><text xml:space="preserve" x="30" y="340" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">Review failures and</text><text xml:space="preserve" x="30" y="367" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">a sample of passes.</text><text xml:space="preserve" x="30" y="394" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">Check the judges</text><text xml:space="preserve" x="30" y="421" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">and criteria too.</text><path d="M254 126 H278 m-7 -7 l7 7 -7 7 M520 126 H544 m-7 -7 l7 7 -7 7 M666 240 V264 m-7 -7 l7 7 7 -7 M544 378 H520 m7 -7 l-7 7 7 7 M278 378 H254 m7 -7 l-7 7 7 7 M134 264 V240 m-7 7 l7 -7 7 7" fill="none" stroke="#6a92a7" stroke-width="3"/></svg>