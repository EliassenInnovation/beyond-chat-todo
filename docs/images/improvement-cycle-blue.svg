<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="title desc"><title id="title">Improve assistance, check the result, repeat</title><desc id="desc">Four steps form a clockwise cycle. Find a recurring difficulty: buyers cannot tell which replacement part fits. Build useful assistance: identify equipment and check compatible parts. Check whether it helped: less effort, fewer incorrect purchases, and fewer calls to support. Choose the next priority: refine this help or address another difficulty. The cycle returns to finding a recurring difficulty.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#6b93a8" stroke-width="1.5"/></marker></defs><rect width="800" height="430" fill="white"/>
<rect x="16" y="16" width="340" height="134" rx="7" fill="#f5f1ee"/><path d="M23 16 H349 Q356 16 356 23 V58 H16 V23 Q16 16 23 16 Z" fill="#2e4294"/><text x="30" y="44" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="white">1. Find a recurring difficulty</text>
<text x="30" y="93" font-family="Arial, sans-serif" font-size="21" fill="#1a1e33">Buyers cannot tell which</text>
<text x="30" y="121" font-family="Arial, sans-serif" font-size="21" fill="#1a1e33">replacement part fits.</text>
<rect x="444" y="16" width="340" height="134" rx="7" fill="#f5f1ee"/><path d="M451 16 H777 Q784 16 784 23 V58 H444 V23 Q444 16 451 16 Z" fill="#2e4294"/><text x="458" y="44" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="white">2. Build useful assistance</text>
<text x="458" y="93" font-family="Arial, sans-serif" font-size="21" fill="#1a1e33">Identify the equipment;</text>
<text x="458" y="121" font-family="Arial, sans-serif" font-size="21" fill="#1a1e33">check which parts fit.</text>
<rect x="444" y="278" width="340" height="134" rx="7" fill="#f5f1ee"/><path d="M451 278 H777 Q784 278 784 285 V320 H444 V285 Q444 278 451 278 Z" fill="#2e4294"/><text x="458" y="306" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="white">3. Check whether it helped</text>
<text x="458" y="344" font-family="Arial, sans-serif" font-size="21" fill="#1a1e33">Less effort?</text>
<text x="458" y="371" font-family="Arial, sans-serif" font-size="21" fill="#1a1e33">Fewer incorrect purchases?</text>
<text x="458" y="398" font-family="Arial, sans-serif" font-size="21" fill="#1a1e33">Fewer calls to support?</text>
<rect x="16" y="278" width="340" height="134" rx="7" fill="#f5f1ee"/><path d="M23 278 H349 Q356 278 356 285 V320 H16 V285 Q16 278 23 278 Z" fill="#2e4294"/><text x="30" y="306" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="white">4. Choose the next priority</text>
<text x="30" y="355" font-family="Arial, sans-serif" font-size="21" fill="#1a1e33">Refine this help or address</text>
<text x="30" y="383" font-family="Arial, sans-serif" font-size="21" fill="#1a1e33">another difficulty.</text>
<g fill="none" stroke="#6b93a8" stroke-width="3" marker-end="url(#arrow)"><path d="M368 91 Q400 65 432 91"/><path d="M614 162 Q664 214 614 266"/><path d="M432 346 Q400 372 368 346"/><path d="M186 266 Q136 214 186 162"/></g><text x="400" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1a1e33">Keep improving</text><text x="400" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">from what you learn</text></svg>