<svg xmlns="http://www.w3.org/2000/svg" width="784" height="670" viewBox="16 16 784 670" role="img" aria-label="One order declaration with adjacent annotations for identity, inputs, policy, recovery, facts, proposal and implementation."><desc>One order declaration with adjacent annotations for identity, inputs, policy, recovery, facts, proposal and implementation.</desc><rect width="800" height="828" fill="white" /><rect x="16" y="16" width="470" height="670" rx="7" fill="#f2f1ee" /><text xml:space="preserve" x="30" y="48" font-family="monospace" font-size="17" fill="#1a1e33">@REGISTRY.action('orders.place',</text><text xml:space="preserve" x="30" y="72" font-family="monospace" font-size="17" fill="#1a1e33">    tool='place_order',</text><text xml:space="preserve" x="516" y="48" font-family="Arial, sans-serif" font-size="19" fill="#1a1e33">One action for every caller;</text><text xml:space="preserve" x="516" y="74" font-family="Arial, sans-serif" font-size="19" fill="#1a1e33">a tool name for the model.</text><path d="M494 30 H502 V82 H494" fill="none" stroke="#6a92a7" stroke-width="3" /><text xml:space="preserve" x="30" y="126" font-family="monospace" font-size="17" fill="#1a1e33">    description='Ask to place an order',</text><text xml:space="preserve" x="516" y="126" font-family="Arial, sans-serif" font-size="19" fill="#1a1e33">Describe the job in words</text><text xml:space="preserve" x="516" y="152" font-family="Arial, sans-serif" font-size="19" fill="#1a1e33">the model can recognize.</text><path d="M494 108 H502 V160 H494" fill="none" stroke="#6a92a7" stroke-width="3" /><text xml:space="preserve" x="30" y="193" font-family="monospace" font-size="17" fill="#1a1e33">    params={'cart_id':</text><text xml:space="preserve" x="30" y="217" font-family="monospace" font-size="17" fill="#1a1e33">            {'type': 'string'}},</text><text xml:space="preserve" x="30" y="241" font-family="monospace" font-size="17" fill="#1a1e33">    effects=('write',),</text><text xml:space="preserve" x="516" y="193" font-family="Arial, sans-serif" font-size="19" fill="#1a1e33">Declare inputs and types,</text><text xml:space="preserve" x="516" y="219" font-family="Arial, sans-serif" font-size="19" fill="#1a1e33">and that the action</text><text xml:space="preserve" x="516" y="245" font-family="Arial, sans-serif" font-size="19" fill="#1a1e33">changes data.</text><path d="M494 175 H502 V251 H494" fill="none" stroke="#6a92a7" stroke-width="3" /><text xml:space="preserve" x="30" y="301" font-family="monospace" font-size="17" fill="#1a1e33">    policy={'person': 'allow',</text><text xml:space="preserve" x="30" y="325" font-family="monospace" font-size="17" fill="#1a1e33">            'agent': 'approval'},</text><text xml:space="preserve" x="516" y="301" font-family="Arial, sans-serif" font-size="19" fill="#1a1e33">The person may act directly.</text><text xml:space="preserve" x="516" y="327" font-family="Arial, sans-serif" font-size="19" fill="#1a1e33">The agent needs approval.</text><path d="M494 283 H502 V335 H494" fill="none" stroke="#6a92a7" stroke-width="3" /><text xml:space="preserve" x="30" y="380" font-family="monospace" font-size="17" fill="#1a1e33">    undone_by=None,</text><text xml:space="preserve" x="30" y="404" font-family="monospace" font-size="17" fill="#1a1e33">    impact='one',</text><text xml:space="preserve" x="516" y="380" font-family="Arial, sans-serif" font-size="19" fill="#1a1e33">Declare recovery and scope.</text><text xml:space="preserve" x="516" y="406" font-family="Arial, sans-serif" font-size="19" fill="#1a1e33">This example store cannot</text><text xml:space="preserve" x="516" y="432" font-family="Arial, sans-serif" font-size="19" fill="#1a1e33">undo a placed order.</text><path d="M494 362 H502 V438 H494" fill="none" stroke="#6a92a7" stroke-width="3" /><text xml:space="preserve" x="30" y="484" font-family="monospace" font-size="17" fill="#1a1e33">    facts=('Orders cannot be changed',),</text><text xml:space="preserve" x="30" y="508" font-family="monospace" font-size="17" fill="#1a1e33">    propose=ask_to_place_order)</text><text xml:space="preserve" x="516" y="484" font-family="Arial, sans-serif" font-size="19" fill="#1a1e33">Tell the model this limit.</text><text xml:space="preserve" x="516" y="510" font-family="Arial, sans-serif" font-size="19" fill="#1a1e33">For the agent, request</text><text xml:space="preserve" x="516" y="536" font-family="Arial, sans-serif" font-size="19" fill="#1a1e33">approval instead of ordering.</text><path d="M494 466 H502 V542 H494" fill="none" stroke="#6a92a7" stroke-width="3" /><text xml:space="preserve" x="30" y="596" font-family="monospace" font-size="17" fill="#1a1e33">def place_order(ctx, cart_id):</text><text xml:space="preserve" x="30" y="620" font-family="monospace" font-size="17" fill="#1a1e33">    order = ctx.store.place(cart_id)</text><text xml:space="preserve" x="30" y="644" font-family="monospace" font-size="17" fill="#1a1e33">    return {'placed': order.id,</text><text xml:space="preserve" x="30" y="668" font-family="monospace" font-size="17" fill="#1a1e33">            'total': order.total}</text><text xml:space="preserve" x="516" y="596" font-family="Arial, sans-serif" font-size="19" fill="#1a1e33">Implement the action once.</text><text xml:space="preserve" x="516" y="622" font-family="Arial, sans-serif" font-size="19" fill="#1a1e33">Return facts produced</text><text xml:space="preserve" x="516" y="648" font-family="Arial, sans-serif" font-size="19" fill="#1a1e33">by the application.</text><path d="M494 578 H502 V678 H494" fill="none" stroke="#6a92a7" stroke-width="3" /></svg>