<svg xmlns="http://www.w3.org/2000/svg" width="800" height="270" viewBox="0 0 800 270" role="img" aria-labelledby="title desc"><title id="title">Advisor: learn a missing fact</title><desc id="desc">Code checks saved goals and supplies onboarding progress. Guidance helps the agent decide when to ask about a gap. The named tool records the fact. Ellipses omit unrelated declaration details.</desc><rect width="800" height="270" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#48669d"/></marker></defs><g font-family="Arial, sans-serif" font-size="16" fill="#1a1e33"><text x="20" y="25" font-weight="bold">Advisor: learn a missing fact</text><rect x="20" y="40" width="420" height="210" rx="7" fill="#f2f1ee"/><rect x="20" y="40" width="420" height="38" rx="7" fill="#48669d"/><text x="36" y="65" fill="white" font-weight="bold">Registry declaration</text><rect x="480" y="40" width="300" height="210" rx="7" fill="#f2f1ee"/><rect x="480" y="40" width="300" height="38" rx="7" fill="#48669d"/><text x="496" y="65" fill="white" font-weight="bold">How it is used</text><text x="34" y="101" font-family="monospace" font-size="14" xml:space="preserve">profile_facts = (</text><text x="34" y="121" font-family="monospace" font-size="14" xml:space="preserve">    ProfileFact(&quot;goals&quot;, ... ,</text><text x="34" y="141" font-family="monospace" font-size="14" xml:space="preserve">        &quot;update_philosophy goals&quot;,</text><text x="34" y="161" font-family="monospace" font-size="14" xml:space="preserve">        lambda ctx: bool(</text><text x="34" y="181" font-family="monospace" font-size="14" xml:space="preserve">            ctx.rule_config.philosophy</text><text x="34" y="201" font-family="monospace" font-size="14" xml:space="preserve">            .get(&quot;goals&quot;)), core=True),</text><text x="34" y="221" font-family="monospace" font-size="14" xml:space="preserve">    ...</text><text x="34" y="241" font-family="monospace" font-size="14" xml:space="preserve">)</text><text x="496" y="104">Code checks saved goals and</text><text x="496" y="129">supplies onboarding progress.</text><text x="496" y="154">Guidance helps the agent decide</text><text x="496" y="179">when to ask about a gap.</text><text x="496" y="204">The named tool records the fact.</text><path d="M445 145H474" stroke="#48669d" stroke-width="2" marker-end="url(#arrow)"/></g></svg>