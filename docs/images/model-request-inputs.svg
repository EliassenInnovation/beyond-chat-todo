<svg xmlns="http://www.w3.org/2000/svg" width="800" height="364" viewBox="0 0 800 364" role="img" aria-label="Five kinds of input inform the next model choice; tool results are available after calls."><desc>Five kinds of input inform the next model choice; tool results are available after calls.</desc><style>text{font-family:Arial,sans-serif;fill:#1A1E33;font-size:20px}.head{fill:white;font-weight:700}.label{font-weight:700}.small{font-size:18px}</style><rect width="800" height="364" fill="white"/><rect x="16" y="12" width="514" height="60" rx="5" fill="#F5F1EE"/><text x="30" y="36" class="label">Instructions</text><text x="30" y="60" class="small">Role, priorities, guidance</text><path d="M530 42H560" stroke="#8EBFB3" stroke-width="3"/><rect x="16" y="82" width="514" height="60" rx="5" fill="#F5F1EE"/><text x="30" y="106" class="label">Tool definitions</text><text x="30" y="130" class="small">Names, descriptions, inputs, application facts</text><path d="M530 112H560" stroke="#8EBFB3" stroke-width="3"/><rect x="16" y="152" width="514" height="60" rx="5" fill="#F5F1EE"/><text x="30" y="176" class="label">Current application state</text><text x="30" y="200" class="small">Screen context and relevant progress</text><path d="M530 182H560" stroke="#8EBFB3" stroke-width="3"/><rect x="16" y="222" width="514" height="60" rx="5" fill="#F5F1EE"/><text x="30" y="246" class="label">Conversation history</text><text x="30" y="270" class="small">Delivered replies and recorded actions</text><path d="M530 252H560" stroke="#8EBFB3" stroke-width="3"/><rect x="16" y="292" width="514" height="60" rx="5" fill="#F5F1EE"/><text x="30" y="316" class="label">Available tool results</text><text x="30" y="340" class="small">Labeled values, dates, missing-data warnings</text><path d="M530 322H560" stroke="#8EBFB3" stroke-width="3"/><path d="M560 42V322 M560 182H596 M586 175L596 182L586 189" stroke="#8EBFB3" stroke-width="3" fill="none"/><rect x="600" y="138" width="184" height="88" rx="5" fill="#