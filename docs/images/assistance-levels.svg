<svg xmlns="http://www.w3.org/2000/svg" width="676" height="420" viewBox="0 0 676 420" role="img" aria-label="Six levels of assistance, with levels two through six supported by learning about the person and noticing when their information may be out of date."><title>Levels of assistance and support across them</title><desc>The six levels are help search, help search with AI, tell me how, show me how, do it for me, and do something new. One unnumbered band spans levels two through six: Learn about me builds context about goals, preferences, and circumstances, and notices when they may be out of date.</desc><g font-family="Arial,sans-serif" fill="#1a1e33"><rect x="8" y="10" width="526" height="59" rx="6" fill="#f5f1ee"/><rect x="8" y="10" width="34" height="59" rx="6" fill="#2e4294"/><text x="18" y="47" fill="white" font-size="20">1</text><text x="54" y="45" font-size="17">Help search</text><text x="244" y="34" font-size="16">Keywords and a search box.</text><text x="244" y="56" font-size="16">The person does the work.</text><rect x="8" y="75" width="526" height="59" rx="6" fill="#f5f1ee"/><rect x="8" y="75" width="34" height="59" rx="6" fill="#2e4294"/><text x="18" y="112" fill="white" font-size="20">2</text><text x="54" y="110" font-size="17">Help search with AI</text><text x="244" y="99" font-size="16">Find relevant instructions.</text><text x="244" y="121" font-size="16">The person does the work.</text><rect x="8" y="140" width="526" height="59" rx="6" fill="#f5f1ee"/><rect x="8" y="140" width="34" height="59" rx="6" fill="#2e4294"/><text x="18" y="177" fill="white" font-size="20">3</text><text x="54" y="175" font-size="17">Tell me how</text><text x="244" y="164" font-size="16">Use the application&#x27;s words:</text><text x="244" y="186" font-size="16">&quot;Click Active below the list.&quot;</text><rect x="8" y="205" width="526" height="59" rx="6" fill="#f5f1ee"/><rect x="8" y="205" width="34" height="59" rx="6" fill="#2e4294"/><text x="18" y="242" fill="white" font-size="20">4</text><text x="54" y="240" font-size="17">Show me how</text><text x="244" y="229" font-size="16">Point to the control</text><text x="244" y="251" font-size="16">on the screen.</text><rect x="8" y="270" width="526" height="59" rx="6" fill="#f5f1ee"/><rect x="8" y="270" width="34" height="59" rx="6" fill="#2e4294"/><text x="18" y="307" fill="white" font-size="20">5</text><text x="54" y="305" font-size="17">Do it for me</text><text x="244" y="294" font-size="16">Perform an authorized action.</text><text x="244" y="316" font-size="16">Confirm what changed.</text><rect x="8" y="335" width="526" height="59" rx="6" fill="#f5f1ee"/><rect x="8" y="335" width="34" height="59" rx="6" fill="#2e4294"/><text x="18" y="372" fill="white" font-size="20">6</text><text x="54" y="370" font-size="17">Do something new</text><text x="244" y="359" font-size="16">Combine capabilities into a</text><text x="244" y="381" font-size="16">workflow with no dedicated button.</text><rect x="550" y="75" width="118" height="319" rx="6" fill="#8ebfb3"/><text x="560" y="131" font-size="17">Learn</text><text x="560" y="154" font-size="17">about me</text><text x="560" y="200" font-size="16">Understand</text><text x="560" y="222" font-size="16">my goals,</text><text x="560" y="244" font-size="16">preferences,</text><text x="560" y="266" font-size="16">and situation.</text><text x="560" y="304" font-size="16">Notice when</text><text x="560" y="326" font-size="16">they may be</text><text x="560" y="348" font-size="16">out of date.</text><text x="668" y="413" text-anchor="end" font-size="14">Support across levels 2–6</text></g></svg>