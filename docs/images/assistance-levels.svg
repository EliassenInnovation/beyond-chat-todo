<svg xmlns="http://www.w3.org/2000/svg" width="1392" height="880" viewBox="0 0 1392 880" role="img" aria-labelledby="title description">
  <title id="title">Levels of assistance</title>
  <desc id="description">Six levels, from help search to combining capabilities into a new workflow. A green Learn about me column supports levels two through six: understand the person's goals, preferences, and situation, and notice when they may be out of date.</desc>
  <rect width="1392" height="880" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#252629">
    <g>
      <rect x="40" y="40" width="1040" height="120" rx="12" fill="#f2efec"/>
      <path d="M52 40 H128 V160 H52 Q40 160 40 148 V52 Q40 40 52 40 Z" fill="#343f92"/>
      <text x="84" y="115" text-anchor="middle" font-size="44" fill="#ffffff">1</text>
      <text x="160" y="111" font-size="34">Help search</text>
      <text x="508" y="89" font-size="32">Keywords and a search box.</text>
      <text x="508" y="131" font-size="32">The person does the work.</text>
    </g>
    <g>
      <rect x="40" y="176" width="1040" height="120" rx="12" fill="#f2efec"/>
      <path d="M52 176 H128 V296 H52 Q40 296 40 284 V188 Q40 176 52 176 Z" fill="#343f92"/>
      <text x="84" y="251" text-anchor="middle" font-size="44" fill="#ffffff">2</text>
      <text x="160" y="247" font-size="34">Help search with AI</text>
      <text x="508" y="225" font-size="32">Find relevant instructions.</text>
      <text x="508" y="267" font-size="32">The person does the work.</text>
    </g>
    <g>
      <rect x="40" y="312" width="1040" height="120" rx="12" fill="#f2efec"/>
      <path d="M52 312 H128 V432 H52 Q40 432 40 420 V324 Q40 312 52 312 Z" fill="#343f92"/>
      <text x="84" y="387" text-anchor="middle" font-size="44" fill="#ffffff">3</text>
      <text x="160" y="383" font-size="34">Tell me how</text>
      <text x="508" y="361" font-size="32">Use the application&#x27;s words:</text>
      <text x="508" y="403" font-size="32">&quot;Click Active below the list.&quot;</text>
    </g>
    <g>
      <rect x="40" y="448" width="1040" height="120" rx="12" fill="#f2efec"/>
      <path d="M52 448 H128 V568 H52 Q40 568 40 556 V460 Q40 448 52 448 Z" fill="#343f92"/>
      <text x="84" y="523" text-anchor="middle" font-size="44" fill="#ffffff">4</text>
      <text x="160" y="519" font-size="34">Show me how</text>
      <text x="508" y="497" font-size="32">Point to the control</text>
      <text x="508" y="539" font-size="32">on the screen.</text>
    </g>
    <g>
      <rect x="40" y="584" width="1040" height="120" rx="12" fill="#f2efec"/>
      <path d="M52 584 H128 V704 H52 Q40 704 40 692 V596 Q40 584 52 584 Z" fill="#343f92"/>
      <text x="84" y="659" text-anchor="middle" font-size="44" fill="#ffffff">5</text>
      <text x="160" y="655" font-size="34">Do it for me</text>
      <text x="508" y="633" font-size="32">Perform an authorized action.</text>
      <text x="508" y="675" font-size="32">Confirm what changed.</text>
    </g>
    <g>
      <rect x="40" y="720" width="1040" height="120" rx="12" fill="#f2efec"/>
      <path d="M52 720 H128 V840 H52 Q40 840 40 828 V732 Q40 720 52 720 Z" fill="#343f92"/>
      <text x="84" y="795" text-anchor="middle" font-size="44" fill="#ffffff">6</text>
      <text x="160" y="791" font-size="34">Do something new</text>
      <text x="508" y="769" font-size="32">Combine capabilities into a</text>
      <text x="508" y="811" font-size="32">workflow with no dedicated button.</text>
    </g>
    <text x="1120" y="95" font-size="32" font-weight="700" fill="#244f46">Learn</text>
    <text x="1120" y="135" font-size="32" font-weight="700" fill="#244f46">about me</text>
    <rect x="1096" y="176" width="256" height="664" rx="12" fill="#8ebfb3"/>
    <text x="1120" y="236" font-size="32" fill="#24423b">
      <tspan x="1120">Understand my</tspan>
      <tspan x="1120" dy="44">goals,</tspan>
      <tspan x="1120" dy="44">preferences,</tspan>
      <tspan x="1120" dy="44">and situation.</tspan>
      <tspan x="1120" dy="60">Notice when</tspan>
      <tspan x="1120" dy="44">they may be</tspan>
      <tspan x="1120" dy="44">out of date.</tspan>
    </text>
  </g>
</svg>
