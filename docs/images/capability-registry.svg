<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1319" viewBox="0 0 560 1319" role="img" aria-label="An illustrative order declaration: identity, tool description, inputs, effects, caller permissions, recovery, proposal handler and shared implementation."><desc>An illustrative order declaration: identity, tool description, inputs, effects, caller permissions, recovery, proposal handler and shared implementation.</desc><rect width="560" height="1319" fill="white"/><rect x="16" y="16" width="528" height="168" rx="9" fill="#f3f4f6"/><rect x="16" y="16" width="528" height="44" rx="9" fill="#304698"/><text xml:space="preserve" x="32" y="46" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="700">One operation</text><text xml:space="preserve" x="32" y="89" font-family="monospace" font-size="18" fill="#1a1e33">@REGISTRY.action(&#x27;orders.place&#x27;,</text><text xml:space="preserve" x="32" y="116" font-family="monospace" font-size="18" fill="#1a1e33">    tool=&#x27;place_order&#x27;,</text><text xml:space="preserve" x="32" y="158" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">Every caller resolves to this action.</text><rect x="16" y="200" width="528" height="224" rx="9" fill="#f3f4f6"/><rect x="16" y="200" width="528" height="44" rx="9" fill="#304698"/><text xml:space="preserve" x="32" y="230" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="700">Purpose and inputs</text><text xml:space="preserve" x="32" y="273" font-family="monospace" font-size="18" fill="#1a1e33">    description=&#x27;Ask to place an order&#x27;,</text><text xml:space="preserve" x="32" y="300" font-family="monospace" font-size="18" fill="#1a1e33">    params={&#x27;cart_id&#x27;: {&#x27;type&#x27;: &#x27;string&#x27;}},</text><text xml:space="preserve" x="32" y="327" font-family="monospace" font-size="18" fill="#1a1e33">    effects=(&#x27;write&#x27;,),</text><text xml:space="preserve" x="32" y="369" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">The model can identify the job.</text><text xml:space="preserve" x="32" y="398" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">Code validates inputs; the action writes data.</text><rect x="16" y="440" width="528" height="197" rx="9" fill="#f3f4f6"/><rect x="16" y="440" width="528" height="44" rx="9" fill="#304698"/><text xml:space="preserve" x="32" y="470" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="700">Caller policy</text><text xml:space="preserve" x="32" y="513" font-family="monospace" font-size="18" fill="#1a1e33">    policy={&#x27;person&#x27;: &#x27;allow&#x27;,</text><text xml:space="preserve" x="32" y="540" font-family="monospace" font-size="18" fill="#1a1e33">            &#x27;agent&#x27;: &#x27;approval&#x27;},</text><text xml:space="preserve" x="32" y="582" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">A person may act directly.</text><text xml:space="preserve" x="32" y="611" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">The agent must request approval.</text><rect x="16" y="653" width="528" height="197" rx="9" fill="#f3f4f6"/><rect x="16" y="653" width="528" height="44" rx="9" fill="#304698"/><text xml:space="preserve" x="32" y="683" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="700">Recovery and impact</text><text xml:space="preserve" x="32" y="726" font-family="monospace" font-size="18" fill="#1a1e33">    undone_by=None,</text><text xml:space="preserve" x="32" y="753" font-family="monospace" font-size="18" fill="#1a1e33">    impact=&#x27;one&#x27;,</text><text xml:space="preserve" x="32" y="795" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">This example store cannot undo an order.</text><text xml:space="preserve" x="32" y="824" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">Registration checks that policy fits recovery.</text><rect x="16" y="866" width="528" height="197" rx="9" fill="#f3f4f6"/><rect x="16" y="866" width="528" height="44" rx="9" fill="#304698"/><text xml:space="preserve" x="32" y="896" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="700">Facts and approval</text><text xml:space="preserve" x="32" y="939" font-family="monospace" font-size="18" fill="#1a1e33">    facts=(&#x27;Orders cannot be changed&#x27;,),</text><text xml:space="preserve" x="32" y="966" font-family="monospace" font-size="18" fill="#1a1e33">    propose=ask_to_place_order)</text><text xml:space="preserve" x="32" y="1008" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">The model receives the application facts.</text><text xml:space="preserve" x="32" y="1037" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">The proposal handler requests approval.</text><rect x="16" y="1079" width="528" height="224" rx="9" fill="#f3f4f6"/><rect x="16" y="1079" width="528" height="44" rx="9" fill="#304698"/><text xml:space="preserve" x="32" y="1109" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="700">Shared implementation</text><text xml:space="preserve" x="32" y="1152" font-family="monospace" font-size="18" fill="#1a1e33">def place_order(ctx, cart_id):</text><text xml:space="preserve" x="32" y="1179" font-family="monospace" font-size="18" fill="#1a1e33">    order = ctx.store.place(cart_id)</text><text xml:space="preserve" x="32" y="1206" font-family="monospace" font-size="18" fill="#1a1e33">    return {&#x27;placed&#x27;: order.id}</text><text xml:space="preserve" x="32" y="1248" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">The operation is implemented once.</text><text xml:space="preserve" x="32" y="1277" font-family="Arial, sans-serif" font-size="20" fill="#1a1e33">Shared execution enforces caller policy.</text></svg>