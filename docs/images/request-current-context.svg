<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390" role="img" aria-label="Conversation history grows while current screen context is refreshed"><desc>Two illustrative Todo requests show the conversation history growing from a request to show active tasks to include its tool call, result, reply, and a follow-up. Each request has one current screen state. Turn one shows all seven tasks; turn two shows the two active tasks, Renew passport and Return library books. Other model inputs are omitted.</desc>
<style>text{font-family:Arial,sans-serif;fill:#1A1E33;font-size:20px}.head{fill:white;font-weight:700}.label{font-weight:700}.small{font-size:18px}.code{font-family:monospace;font-size:18px}</style>
