<text x="30" y="39" class="head">Turn 1 · Show active tasks</text>
<text x="30" y="80" class="label">Conversation history</text>
<rect x="424" y="12" width="360" height="334" rx="7" fill="#F5F1EE"/>
<path d="M431 12 H777 Q784 12 784 19 V52 H424 V19 Q424 12 431 12 Z" fill="#2E4294"/>
<text x="438" y="39" class="head">Turn 2 · Complete the second task</text>
